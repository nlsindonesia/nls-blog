<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Player - NLS Belajar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; background-image: radial-gradient(at 0% 0%, hsla(228,100%,98%,1) 0, transparent 50%), radial-gradient(at 100% 100%, hsla(240,100%,98%,1) 0, transparent 50%); }
        .player-scroll::-webkit-scrollbar { width: 6px; }
        .player-scroll::-webkit-scrollbar-track { background: transparent; }
        .player-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .prose img { border-radius: 0.75rem; max-width: 100%; height: auto; }
        [x-cloak] { display: none !important; }
    </style>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body class="text-slate-800 antialiased h-screen overflow-hidden flex flex-col" x-data="lmsPlayer()" x-init="init()">
    <!-- Hero Header Premium (Compact) -->
    <header class="bg-gradient-to-r from-indigo-50/90 via-sky-50/80 to-purple-50/90 backdrop-blur-2xl border-b border-indigo-100/60 shrink-0 shadow-sm z-20 relative">
        <!-- Dekorasi Background -->
        <div class="absolute top-0 right-0 w-64 h-64 bg-indigo-200/40 rounded-full blur-3xl -translate-y-1/2 translate-x-1/3"></div>
        
        <div class="max-w-[1600px] mx-auto relative z-10 px-4 sm:px-6 py-3 sm:py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <!-- Kiri: Logo & Back -->
            <div class="flex items-center w-full md:w-auto justify-between md:justify-start gap-4">
                <div class="flex items-center gap-3">
                    <a href="index.html" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white/60 hover:bg-white shadow-[0_2px_8px_rgba(0,0,0,0.03)] border border-indigo-50 text-indigo-900 transition-all active:scale-95 shrink-0">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
                    </a>
                    
                    <div class="flex items-center gap-3 pr-4 md:border-r border-indigo-200/50 shrink-0">
                        <img src="/nls-logo-300.png" alt="NLS Logo" class="w-8 h-8 object-contain drop-shadow-sm">
                        <div class="hidden sm:block font-black text-xs tracking-tight text-indigo-950 uppercase">Next Level Study</div>
                    </div>
                </div>
                
                <button @click="sidebarOpen = !sidebarOpen" class="md:hidden w-10 h-10 flex items-center justify-center rounded-xl bg-white/60 hover:bg-white text-indigo-900 shadow-sm border border-indigo-50">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
            </div>
            
            <!-- Tengah: Judul Kelas -->
            <div class="flex-1 w-full text-center md:text-left min-w-0 md:px-4">
                <h1 class="text-base sm:text-lg font-black text-indigo-950 truncate" x-text="courseData ? courseData.title : 'Program Belajar NLS'"></h1>
                <p class="hidden md:block text-[10px] text-indigo-800/70 font-bold truncate mt-0.5" x-text="courseData ? 'Selesaikan semua misi pembelajaran untuk lulus' : ''"></p>
            </div>
            
            <!-- Kanan: Progress -->
            <div class="w-full md:w-64 shrink-0 bg-white/40 backdrop-blur-xl p-2.5 rounded-2xl border border-white/60 shadow-sm flex flex-col justify-center">
                <div class="flex items-center justify-between mb-1.5 px-1">
                    <span class="text-[9px] font-black uppercase tracking-wider text-indigo-900 flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-pulse"></span>
                        Progress Kelas
                    </span>
                    <span class="text-xs font-black text-indigo-700" x-text="getProgress() + '%'"></span>
                </div>
                <div class="w-full h-2 bg-indigo-100/50 rounded-full overflow-hidden border border-indigo-50/50 shadow-inner">
                    <div class="h-full bg-gradient-to-r from-sky-400 to-indigo-500 rounded-full transition-all duration-1000 ease-out relative" :style="'width: ' + getProgress() + '%'">
                        <div class="absolute inset-0 bg-white/20 w-full h-full animate-[shimmer_2s_infinite]"></div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative bg-slate-50">
        <!-- Mesh Background -->
        <div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(#4f46e5 2px, transparent 2px); background-size: 30px 30px;"></div>
        
        <!-- Sidebar Timeline -->
        <aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'" class="absolute md:relative z-10 w-[320px] h-full bg-white/80 backdrop-blur-2xl border-r border-indigo-100/60 shadow-[8px_0_30px_-4px_rgba(0,0,0,0.05)] md:shadow-none transition-transform duration-300 md:translate-x-0 flex flex-col shrink-0">
            <div class="p-5 border-b border-indigo-50 flex items-center justify-between shrink-0 bg-white/50">
                <h2 class="text-[11px] font-black uppercase tracking-widest text-indigo-950 flex items-center gap-2">
                    <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                    Alur Belajar
                </h2>
                <button @click="sidebarOpen = false" class="md:hidden w-8 h-8 flex items-center justify-center rounded-xl bg-slate-100 text-slate-500 hover:text-rose-600">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto player-scroll p-5 space-y-8">
                <template x-if="babs.length === 0">
                    <div class="text-center p-8 text-indigo-300 text-xs font-bold bg-indigo-50/50 rounded-3xl border border-indigo-100/50 border-dashed">Modul belum tersedia.</div>
                </template>
                
                <template x-for="(bab, bIdx) in babs" :key="bab.id">
                    <div class="relative">
                        <!-- Bab Header (Sticky) -->
                        <div class="sticky top-0 z-20 bg-white/90 backdrop-blur-md rounded-2xl border border-indigo-100/60 p-4 shadow-sm mb-4 cursor-pointer flex justify-between items-center" @click="bab.expanded = !bab.expanded">
                            <h3 class="text-xs font-black text-indigo-950 uppercase tracking-wide" x-text="bab.title"></h3>
                            <div class="w-6 h-6 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-400">
                                <svg class="w-3 h-3 transition-transform duration-300" :class="bab.expanded ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"/></svg>
                            </div>
                        </div>
                        
                        <!-- Timeline Nodes -->
                        <div x-show="bab.expanded" x-collapse>
                            <div class="relative pl-8 pb-4 ml-2">
                                <!-- Garis Waktu -->
                                <div class="absolute left-[9px] top-4 bottom-0 w-[2px] bg-gradient-to-b from-indigo-200 via-indigo-100 to-transparent rounded-full"></div>
                                
                                <template x-for="(node, nIdx) in bab.subBabs" :key="node.id">
                                    <div class="relative mb-6 group">
                                        <!-- Titik Timeline -->
                                        <div class="absolute -left-10 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full border-[3px] border-white shadow-sm flex items-center justify-center z-10 transition-colors"
                                            :class="isCompleted(node.id) ? 'bg-emerald-400' : (activeNode && activeNode.id === node.id ? 'bg-indigo-500' : 'bg-indigo-100')">
                                            <svg x-show="isCompleted(node.id)" class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7"/></svg>
                                        </div>
                                        
                                        <!-- Kartu Materi -->
                                        <button @click="openNode(node)" 
                                            :class="activeNode && activeNode.id === node.id ? 'bg-white shadow-[0_8px_30px_-4px_rgba(79,70,229,0.15)] border-indigo-300 ring-2 ring-indigo-100 scale-[1.02]' : 'bg-white/60 hover:bg-white border-indigo-50 hover:border-indigo-200 hover:shadow-md'"
                                            class="w-full text-left rounded-3xl p-4 border transition-all duration-300 relative overflow-hidden">
                                            
                                            <!-- Garis indikator node aktif -->
                                            <div x-show="activeNode && activeNode.id === node.id" class="absolute left-0 top-0 bottom-0 w-1 bg-indigo-500"></div>

                                            <div class="flex flex-col gap-3">
                                                <!-- Icon & Badge -->
                                                <div class="flex items-center justify-between">
                                                    <div class="w-10 h-10 rounded-2xl flex items-center justify-center shrink-0 shadow-inner"
                                                        :class="node.type === 'materi' ? 'bg-sky-100 text-sky-600' : (node.type === 'kuis' ? 'bg-amber-100 text-amber-600' : 'bg-rose-100 text-rose-600')">
                                                        <svg x-show="node.type === 'materi'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                                                        <svg x-show="node.type === 'kuis'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
                                                        <svg x-show="node.type === 'video'" class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                                    </div>
                                                    
                                                    <span class="text-[9px] font-black uppercase tracking-wider px-2.5 py-1 rounded-lg"
                                                        :class="isCompleted(node.id) ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'">
                                                        <span x-text="isCompleted(node.id) ? 'Selesai' : 'Belum'"></span>
                                                    </span>
                                                </div>
                                                
                                                <!-- Title -->
                                                <div>
                                                    <h4 class="text-xs font-black text-indigo-950 leading-snug line-clamp-2" x-text="node.title"></h4>
                                                    <div class="flex items-center gap-1.5 mt-2 text-[10px] text-indigo-800/60 font-bold">
                                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                                        <span x-text="node.duration || '15 Menit'"></span>
                                                    </div>
                                                </div>
                                            </div>
                                        </button>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 relative overflow-y-auto player-scroll flex flex-col z-0">
            
            <template x-if="!activeNode">
                <div class="flex-1 flex flex-col items-center justify-center p-8 text-center">
                    <div class="w-32 h-32 rounded-[2rem] bg-indigo-100/50 shadow-inner flex items-center justify-center mb-8 rotate-3">
                        <svg class="w-16 h-16 text-indigo-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                    </div>
                    <h2 class="text-3xl font-black text-indigo-950 mb-3 tracking-tight">Pilih Materi Perjalananmu</h2>
                    <p class="text-sm font-bold text-indigo-800/60 max-w-sm">Pilih kartu misi di sebelah kiri untuk mulai mengumpulkan pengetahuan dan XP!</p>
                </div>
            </template>

            <template x-if="activeNode">
                <div class="w-full max-w-6xl mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
                    
                    <!-- Content Header -->
                    <div class="bg-white/90 backdrop-blur-xl rounded-[2rem] p-6 sm:p-10 shadow-[0_8px_40px_-12px_rgba(0,0,0,0.08)] border border-indigo-50 relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-64 h-64 bg-gradient-to-br from-indigo-100/40 to-sky-100/40 rounded-full blur-3xl -translate-y-1/2 translate-x-1/3"></div>
                        
                        <div class="relative z-10 flex flex-col md:flex-row md:items-end justify-between gap-6">
                            <div class="flex-1">
                                <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-xl text-[10px] font-black uppercase tracking-widest mb-4 shadow-inner"
                                    :class="activeNode.type === 'materi' ? 'bg-sky-100 text-sky-700' : (activeNode.type === 'kuis' ? 'bg-amber-100 text-amber-700' : 'bg-rose-100 text-rose-700')">
                                    <span class="w-1.5 h-1.5 rounded-full" :class="activeNode.type === 'materi' ? 'bg-sky-500' : (activeNode.type === 'kuis' ? 'bg-amber-500' : 'bg-rose-500')"></span>
                                    <span x-text="activeNode.type"></span>
                                </div>
                                <h2 class="text-3xl sm:text-4xl lg:text-5xl font-black text-indigo-950 leading-tight tracking-tight mb-3" x-text="activeNode.title"></h2>
                                <p class="text-sm sm:text-base text-indigo-800/70 font-medium max-w-3xl" x-text="activeNode.summary || 'Pelajari materi ini dengan saksama untuk meningkatkan pemahamanmu.'"></p>
                            </div>
                            
                            <div class="shrink-0 w-full md:w-auto">
                                <button @click="markAsCompleted(activeNode.id)" 
                                    :class="isCompleted(activeNode.id) ? 'bg-emerald-100 text-emerald-800 border-emerald-200' : 'bg-gradient-to-r from-indigo-500 to-sky-500 text-white hover:shadow-lg hover:shadow-indigo-500/30'"
                                    class="w-full md:w-auto px-8 py-4 rounded-2xl font-black text-sm transition-all flex items-center justify-center gap-3 border active:scale-95">
                                    <svg x-show="isCompleted(activeNode.id)" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                                    <span x-text="isCompleted(activeNode.id) ? 'Telah Diselesaikan' : 'Tandai Selesai & Lanjut'"></span>
                                    <svg x-show="!isCompleted(activeNode.id)" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 5l7 7-7 7M5 5l7 7-7 7"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Materi Content -->
                    <template x-if="activeNode.type === 'materi'">
                        <div class="bg-white rounded-[2.5rem] shadow-xl border-2 border-indigo-100 ring-4 ring-indigo-50 overflow-hidden relative">
                            <template x-if="activeNode.materiFormat === 'pdf' && activeNode.pdfUrl">
                                <div class="w-full h-[700px] bg-slate-100 relative">
                                    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-sky-400 to-indigo-500 z-10"></div>
                                    <iframe :src="activeNode.pdfUrl + '/preview'" class="w-full h-full border-0 relative z-0"></iframe>
                                </div>
                            </template>
                            <template x-if="activeNode.materiFormat === 'ckeditor' || activeNode.materiFormat === 'html'">
                                <div class="p-8 sm:p-12 lg:p-16 prose prose-lg prose-slate max-w-none prose-headings:font-black prose-headings:tracking-tight prose-a:text-indigo-600 prose-img:rounded-3xl prose-img:shadow-xl" x-html="activeNode.rawHtml"></div>
                            </template>
                        </div>
                    </template>

                    <!-- Video Content -->
                    <template x-if="activeNode.type === 'video'">
                        <div class="bg-slate-950 rounded-[2.5rem] shadow-[0_20px_60px_-15px_rgba(0,0,0,0.1)] overflow-hidden aspect-video relative flex flex-col items-center justify-center border-4 border-white" x-init="initYoutubePlayer()">
                            <template x-if="activeNode.videoUrl">
                                <div id="yt-player-container" class="w-full h-full absolute inset-0 rounded-[2rem] overflow-hidden"></div>
                            </template>
                            <template x-if="!activeNode.videoUrl">
                                <div class="text-slate-500 text-sm font-bold flex flex-col items-center gap-3">
                                    <svg class="w-12 h-12 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                                    Link Video Belum Tersedia
                                </div>
                            </template>

                            <!-- Interactive Quiz Overlay -->
                            <template x-if="interactiveQuiz.active">
                                <div class="absolute inset-0 z-10 bg-slate-900/90 backdrop-blur-xl flex flex-col p-6 sm:p-10 overflow-y-auto">
                                    <div class="max-w-3xl w-full mx-auto bg-white rounded-[2.5rem] p-8 sm:p-12 shadow-2xl relative mt-auto mb-auto border-[6px] border-white/20 bg-clip-padding">
                                        <div class="flex items-center gap-4 mb-8">
                                            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-rose-400 to-rose-600 text-white flex items-center justify-center shadow-lg shadow-rose-500/30">
                                                <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
                                            </div>
                                            <div>
                                                <h3 class="font-black text-slate-900 text-2xl">Kuis Interaktif</h3>
                                                <p class="text-xs font-bold text-rose-500 uppercase tracking-widest mt-1">Video dijeda. Jawab untuk melanjutkan.</p>
                                            </div>
                                        </div>

                                        <div class="mb-8">
                                            <h4 class="font-black text-slate-800 text-xl leading-relaxed" x-html="interactiveQuiz.currentQ.text"></h4>
                                        </div>

                                        <!-- Render Simple PG for Interactive Quiz -->
                                        <template x-if="interactiveQuiz.currentQ.type === 'pg'">
                                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                <template x-for="(opt, oIdx) in interactiveQuiz.currentQ.options" :key="oIdx">
                                                    <label class="flex items-start gap-4 p-5 rounded-2xl border-2 border-slate-100 hover:border-indigo-300 hover:bg-indigo-50/50 cursor-pointer transition-all" :class="interactiveQuiz.answer == oIdx ? 'bg-indigo-50 border-indigo-500 shadow-md shadow-indigo-100' : ''">
                                                        <input type="radio" :name="'iq_' + interactiveQuiz.currentQ.id" :value="oIdx" x-model.number="interactiveQuiz.answer" class="mt-1 w-5 h-5 text-indigo-600 border-slate-300 focus:ring-indigo-600 cursor-pointer">
                                                        <span class="text-base text-slate-700 font-bold" x-text="opt"></span>
                                                    </label>
                                                </template>
                                            </div>
                                        </template>

                                        <template x-if="interactiveQuiz.currentQ.type !== 'pg'">
                                            <div class="p-6 bg-amber-50 rounded-2xl border border-amber-200 text-amber-800 text-sm font-bold flex gap-4 items-center">
                                                <svg class="w-8 h-8 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                                Tipe soal ini belum didukung di Pop-up Interactive Video. Silakan gunakan Pilihan Ganda Sederhana.
                                            </div>
                                        </template>

                                        <div class="mt-10 flex flex-col sm:flex-row justify-end gap-4">
                                            <button @click="skipInteractiveQuiz()" class="px-6 py-4 rounded-2xl font-black text-slate-500 hover:bg-slate-100 hover:text-slate-700 text-sm transition-colors">Lewati Kuis</button>
                                            <button @click="submitInteractiveQuiz()" class="px-8 py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-black text-sm shadow-xl shadow-indigo-600/30 transition-all flex items-center justify-center gap-3 active:scale-95">
                                                Kirim Jawaban & Lanjut
                                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- CBT DOM START -->
                    <!-- Quiz Content -->
                    <template x-if="activeNode.type === 'kuis'">
                        <div class="w-full">
                            
                            <!-- Halaman Sambutan (Sebelum Kuis Mulai) -->
                            <template x-if="!quizState.inProgress && !quizState.submitted">
                                <div class="bg-white rounded-[2.5rem] p-10 sm:p-16 shadow-xl border border-indigo-50 text-center relative overflow-hidden">
                                    <div class="absolute top-0 right-0 w-64 h-64 bg-gradient-to-br from-indigo-100/50 to-sky-100/50 rounded-full blur-3xl -translate-y-1/2 translate-x-1/3 pointer-events-none"></div>
                                    <div class="relative z-10">
                                        <div class="w-24 h-24 mx-auto rounded-3xl bg-indigo-100/50 shadow-inner flex items-center justify-center mb-6 text-indigo-500">

    <script>
        function lmsPlayer() {
            return {
                sidebarOpen: false,
                courseData: null,
                babs: [],
                activeNode: null,
                completedNodes: [],
                quizAnswers: {},
                quizState: { submitted: false, score: 0, correct: 0, total: 0, inProgress: false, currentQIdx: 0, doubtful: [], timeLeft: 0, timerInterval: null },
                
                // YouTube Interactive API state
                ytPlayer: null,
                ytPollInterval: null,
                interactiveQuiz: {
                    active: false,
                    currentQ: null,
                    answer: null,
                    answeredQs: []
                },
                
                async init() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const courseId = urlParams.get('course');
                    
                    if (courseId) {
                        try {
                            const res = await fetch('/api/pg-lms', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ action: 'get_courses' })
                            });
                            const data = await res.json();
                            if (data.success && data.data) {
                                const course = data.data.find(c => c.id === courseId);
                                if (course) {
                                    this.courseData = course;
                                    let rawBabs = (course.babs && course.babs.length > 0) ? course.babs : 
                                                  ((course.content && course.content.length > 0) ? course.content : (course.modules || []));
                                    if (rawBabs.length > 0 && rawBabs[0].subBabs === undefined) {
                                        this.babs = [{ id: 'b1', title: 'Bab 1 (Semua Modul)', expanded: true, subBabs: rawBabs }];
                                    } else {
                                        this.babs = rawBabs;
                                    }
                                } else {
                                    this.tryLoadDraft();
                                }
                            } else {
                                this.tryLoadDraft();
                            }
                        } catch(e) {
                            this.tryLoadDraft();
                        }
                    } else {
                        this.tryLoadDraft();
                    }
                    
                    // Fetch completed modules from server if available (mocked for now since it needs user data)
                    this.loadProgress();

                    // Load YT Iframe API
                    if (!window.YT) {
                        const tag = document.createElement('script');
                        tag.src = "https://www.youtube.com/iframe_api";
                        const firstScriptTag = document.getElementsByTagName('script')[0];
                        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
                    }
                    
                    // Auto open first node
                    if (this.babs.length > 0 && this.babs[0].subBabs && this.babs[0].subBabs.length > 0) {
                        this.openNode(this.babs[0].subBabs[0]);
                    }
                },

                tryLoadDraft() {
                    const saved = localStorage.getItem('lms_builder_draft');
                    if (saved) {
                        try {
                            this.babs = JSON.parse(saved);
                        } catch(e) { console.error('Gagal meload data', e); }
                    }
                },

                async loadProgress() {
                    try {
                        const sessionRaw = localStorage.getItem('nls_student_auth_session') || localStorage.getItem('nls_auth_session');
                        if (sessionRaw && this.courseData) {
                            const session = JSON.parse(sessionRaw);
                            if (session.id) {
                                const res = await fetch('/api/pg-lms', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ action: 'get_lms_data', userId: session.id })
                                });
                                const data = await res.json();
                                if (data.success && data.lmsData && data.lmsData.progressMap) {
                                    const courseProgress = data.lmsData.progressMap[this.courseData.id];
                                    if (courseProgress && courseProgress.completedModules) {
                                        this.completedNodes = courseProgress.completedModules;
                                    }
                                }
                            }
                        }
                    } catch(e) {
                        console.log('Failed to load progress', e);
                    }
                },

                initYoutubePlayer() {
                    if (this.ytPlayer) {
                        this.ytPlayer.destroy();
                        this.ytPlayer = null;
                    }
                    if (this.ytPollInterval) {
                        clearInterval(this.ytPollInterval);
                    }
                    
                    this.interactiveQuiz.active = false;
                    this.interactiveQuiz.answeredQs = [];
                    
                    if (!this.activeNode || this.activeNode.type !== 'video' || !this.activeNode.videoUrl) return;
                    
                    const videoId = this.extractYoutubeId(this.activeNode.videoUrl);
                    if (!videoId) return;

                    const setupPlayer = () => {
                        this.ytPlayer = new YT.Player('yt-player-container', {
                            videoId: videoId,
                            playerVars: { 'playsinline': 1 },
                            events: {
                                'onStateChange': this.onPlayerStateChange.bind(this)
                            }
                        });
                    };

                    if (window.YT && window.YT.Player) {
                        setupPlayer();
                    } else {
                        window.onYouTubeIframeAPIReady = () => {
                            setupPlayer();
                        };
                    }
                },

                onPlayerStateChange(event) {
                    if (event.data == YT.PlayerState.PLAYING) {
                        this.ytPollInterval = setInterval(() => this.checkInteractiveQuizzes(), 1000);
                    } else {
                        clearInterval(this.ytPollInterval);
                    }
                    
                    // Mark video as completed if it ends
                    if (event.data == YT.PlayerState.ENDED) {
                        this.markAsCompleted(this.activeNode.id);
                    }
                },

                checkInteractiveQuizzes() {
                    if (!this.ytPlayer || !this.activeNode || !this.activeNode.questions) return;
                    
                    const currentTime = this.ytPlayer.getCurrentTime();
                    
                    // Find a question that should trigger now
                    const qToTrigger = this.activeNode.questions.find(q => 
                        q.videoTimestamp && 
                        parseInt(q.videoTimestamp) <= currentTime && 
                        !this.interactiveQuiz.answeredQs.includes(q.id)
                    );

                    if (qToTrigger) {
                        this.ytPlayer.pauseVideo();
                        this.interactiveQuiz.currentQ = qToTrigger;
                        this.interactiveQuiz.answer = null;
                        this.interactiveQuiz.active = true;
                    }
                },
                
                skipInteractiveQuiz() {
                    this.interactiveQuiz.answeredQs.push(this.interactiveQuiz.currentQ.id);
                    this.interactiveQuiz.active = false;
                    if (this.ytPlayer) this.ytPlayer.playVideo();
                },

                submitInteractiveQuiz() {
                    if (this.interactiveQuiz.answer === null) {
                        alert('Silakan pilih jawaban terlebih dahulu!');
                        return;
                    }
                    
                    const q = this.interactiveQuiz.currentQ;
                    if (this.interactiveQuiz.answer == q.correctAnswers) {
                        // Show toast or something for correct answer
                        // alert('Benar!');
                    } else {
                        // alert('Salah, tapi Anda bisa lanjut menonton.');
                    }
                    
                    this.skipInteractiveQuiz(); // Resumes video and marks as answered
                },

                openNode(node) {
                    if (this.ytPlayer) {
                        this.ytPlayer.destroy();
                        this.ytPlayer = null;
                    }
                    if (this.ytPollInterval) clearInterval(this.ytPollInterval);
                    
                    this.activeNode = node;
                    this.sidebarOpen = false;
                    this.quizState.submitted = false;
                      this.quizState.inProgress = false;
                      if (this.quizState.timerInterval) clearInterval(this.quizState.timerInterval);
                    this.quizAnswers = {};
                    
                    // Allow Alpine to update DOM, then init player if video
                    this.$nextTick(() => {
                        if (this.activeNode.type === 'video') {
                            this.initYoutubePlayer();
                        }
                        if (window.MathJax) {
                            MathJax.typesetPromise().catch(err => console.log('MathJax error:', err));
                        }
                    });
                },


                isCompleted(id) {
                    return this.completedNodes.includes(id);
                },

                markAsCompleted(id) {
                    if (!this.completedNodes.includes(id)) {
                        this.completedNodes.push(id);
                        
                        // Sync to database
                        try {
                            const sessionRaw = localStorage.getItem('nls_student_auth_session') || localStorage.getItem('nls_auth_session');
                            if (sessionRaw && this.courseData) {
                                const session = JSON.parse(sessionRaw);
                                if (session.id) {
                                    fetch('/api/pg-lms', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({
                                            action: 'update_progress',
                                            userId: session.id,
                                            courseId: this.courseData.id,
                                            progress: this.getProgress(),
                                            completedModules: this.completedNodes
                                        })
                                    }).catch(e => {});
                                }
                            }
                        } catch(e) {}
                    }
                },

                getProgress() {
                    let totalNodes = 0;
                    this.babs.forEach(b => totalNodes += (b.subBabs ? b.subBabs.length : 0));
                    if (totalNodes === 0) return 0;
                    return Math.round((this.completedNodes.length / totalNodes) * 100);
                },

                extractYoutubeId(url) {
                    if (!url) return '';
                    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                    const match = url.match(regExp);
                    return (match && match[2].length === 11) ? match[2] : null;
                },

                
                startQuiz() {
                    this.quizState.inProgress = true;
                    this.quizState.currentQIdx = 0;
                    this.quizState.doubtful = [];
                    this.quizAnswers = {};
                    this.quizState.submitted = false;
                    
                    let durationStr = this.activeNode.duration || '15 Menit';
                    let mins = parseInt(durationStr.replace(/\D/g, ''));
                    if (isNaN(mins) || mins <= 0) mins = 15;
                    this.quizState.timeLeft = mins * 60;
                    
                    if (this.quizState.timerInterval) clearInterval(this.quizState.timerInterval);
                    this.quizState.timerInterval = setInterval(() => {
                        this.quizState.timeLeft--;
                        if (this.quizState.timeLeft <= 0) {
                            clearInterval(this.quizState.timerInterval);
                            this.submitQuiz(); 
                        }
                    }, 1000);
                    
                    this.$nextTick(() => { if (window.MathJax) MathJax.typesetPromise(); });
                },
                
                formatTime(seconds) {
                    if (seconds < 0) seconds = 0;
                    let h = Math.floor(seconds / 3600);
                    let m = Math.floor((seconds % 3600) / 60);
                    let s = seconds % 60;
                    if (h > 0) return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                },
                
                toggleDoubtful() {
                    const q = this.activeNode.questions[this.quizState.currentQIdx];
                    if (!q) return;
                    if (this.quizState.doubtful.includes(q.id)) {
                        this.quizState.doubtful = this.quizState.doubtful.filter(id => id !== q.id);
                    } else {
                        this.quizState.doubtful.push(q.id);
                    }
                },
                
                getNavStatus(qId) {
                    if (this.quizState.doubtful.includes(qId)) return 'ragu';
                    const ans = this.quizAnswers[qId];
                    let answered = false;
                    if (ans !== undefined && ans !== null && ans !== '') {
                        if (Array.isArray(ans) && ans.length > 0) answered = true;
                        else if (typeof ans === 'object' && Object.keys(ans).length > 0) answered = true;
                        else if (typeof ans === 'string' && ans.trim() !== '') answered = true;
                        else if (typeof ans === 'number') answered = true;
                    }
                    return answered ? 'terjawab' : 'belum';
                },
                
                goToQuestion(idx) {
                    this.quizState.currentQIdx = idx;
                    this.$nextTick(() => { if (window.MathJax) MathJax.typesetPromise(); });
                },
                
                nextQuestion() {
                    if (this.quizState.currentQIdx < this.activeNode.questions.length - 1) {
                        this.quizState.currentQIdx++;
                        this.$nextTick(() => { if (window.MathJax) MathJax.typesetPromise(); });
                    }
                },
                
                prevQuestion() {
                    if (this.quizState.currentQIdx > 0) {
                        this.quizState.currentQIdx--;
                        this.$nextTick(() => { if (window.MathJax) MathJax.typesetPromise(); });
                    }
                },
                
submitQuiz() {
                    if (this.quizState.timerInterval) clearInterval(this.quizState.timerInterval);
                    this.quizState.inProgress = false;
                    if (!this.activeNode || !this.activeNode.questions) return;
                    
                    let correct = 0;
                    let totalGradable = 0;
                    
                    this.activeNode.questions.forEach(q => {
                        if (q.type === 'essai') return; // Skip auto-grading for essay
                        
                        totalGradable++;
                        const ans = this.quizAnswers[q.id];
                        
                        if (q.type === 'pg') {
                            if (ans == q.correctAnswers) correct++;
                        } 
                        else if (q.type === 'pg_kompleks') {
                            const correctArr = q.correctAnswersArray || [];
                            const userArr = ans || [];
                            if (correctArr.length === userArr.length && correctArr.every(val => userArr.includes(val))) {
                                correct++;
                            }
                        }
                        else if (q.type === 'pg_majemuk') {
                            let allMatch = true;
                            const userObj = ans || {};
                            q.statements.forEach((stmt, sIdx) => {
                                if (userObj[sIdx] !== stmt.isCorrect) allMatch = false;
                            });
                            if (allMatch && q.statements.length > 0) correct++;
                        }
                        else if (q.type === 'jodoh') {
                            let allMatch = true;
                            const userObj = ans || {};
                            q.pairs.forEach((pair, pIdx) => {
                                if (userObj[pIdx] !== pair.right) allMatch = false;
                            });
                            if (allMatch && q.pairs.length > 0) correct++;
                        }
                        else if (q.type === 'isian') {
                            if (!q.shortAnswerKeys) return;
                            const keys = q.shortAnswerKeys.toLowerCase().split(',').map(k => k.trim());
                            if (ans && keys.includes(ans.toString().toLowerCase().trim())) correct++;
                        }
                    });

                    this.quizState.total = totalGradable;
                    this.quizState.correct = correct;
                    this.quizState.score = totalGradable > 0 ? Math.round((correct / totalGradable) * 100) : 100;
                    this.quizState.submitted = true;
                    this.markAsCompleted(this.activeNode.id);
                }
            }
        }
    </script>
