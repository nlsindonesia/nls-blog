                    let text = String(str);

                    // 1. Convert KaTeX / MathJax HTML tags if any HTML is passed
                    text = text.replace(/<span[^>]*class=["'][^"']*math-display[^"']*["'][^>]*>([\s\S]*?)<\/span>/gi, (m, c) => `\n\n$$${c.trim()}$$\n\n`);
                    text = text.replace(/<div[^>]*class=["'][^"']*math-display[^"']*["'][^>]*>([\s\S]*?)<\/div>/gi, (m, c) => `\n\n$$${c.trim()}$$\n\n`);
                    text = text.replace(/<span[^>]*class=["'][^"']*(?:math-inline|math|tex-span)[^"']*["'][^>]*>([\s\S]*?)<\/span>/gi, (m, c) => `$${c.trim()}$`);
                    text = text.replace(/<var\b[^>]*>([\s\S]*?)<\/var>/gi, (m, c) => `$${c.trim()}$`);

                    // 2. Normalize Codeforces triple dollars: $$$x$$$ -> $x$
                    text = text.replace(/\$\$\$\s*([\s\S]*?)\s*\$\$\$/g, (m, c) => `$${c.trim()}$`);

                    // 3. Normalize LaTeX bracket delimiters \( ... \) and \[ ... \]
                    text = text.replace(/\\\(\s*([\s\S]*?)\s*\\\)/g, (m, c) => `$${c.trim()}$`);
                    text = text.replace(/\\\[\s*([\s\S]*?)\s*\\\]/g, (m, c) => `\n\n$$${c.trim()}$$\n\n`);

                    // 4. Split by existing $ blocks to protect already delimited formulas
                    const parts = text.split(/(\$\$[\s\S]*?\$\$|\$[^\$\n]+?\$)/g);

                    for (let i = 0; i < parts.length; i += 2) {
                        let seg = parts[i];
                        if (!seg) continue;

                        const lines = seg.split('\n');
                        const processedLines = lines.map(line => {
                            let l = line;
                            const hasLatexCmd = /\\(?:le|ge|cdot|dots|times|sim|approx|neq|to|sum|prod|frac|sqrt|binom|mathcal|mathbf|pmod|gcd|alpha|beta|gamma|delta|pi|theta|infty|in|notin)\b/.test(l);
                            
                            if (hasLatexCmd) {
                                // Bullet lines (constraints), e.g. "• 1 \le n \le 2 \cdot 10^5"
                                const bulletMatch = l.match(/^(\s*[•\-\*]\s*)(.+)$/);
                                if (bulletMatch) {
                                    const bullet = bulletMatch[1];
                                    const rest = bulletMatch[2].trim();
                                    if (!rest.includes('$') && /\\(?:le|ge|cdot|dots|times|neq|<|>|=|10\^)/.test(rest)) {
                                        return `${bullet}$${rest}$`;
                                    }
                                }

                                // Bare constraint line without bullet: "1 \le n \le 2 \cdot 10^5"
                                const trimmed = l.trim();
                                if (!trimmed.includes('$') && /^([0-9a-zA-Z\\_^{}\s,.<>=+\-*\/|~:()]+?\\(?:le|ge|cdot|times|sim|neq)[0-9a-zA-Z\\_^{}\s,.<>=+\-*\/|~:()]*)$/.test(trimmed)) {
                                    return l.replace(trimmed, `$${trimmed}$`);
                                }

                                // Subscript sequences in sentences: "x_1,x_2,\dots,x_n" or "a_1, a_2, \dots, a_n"
                                l = l.replace(/\b([a-zA-Z][0-9a-zA-Z_^{}]*(?:,\s*[a-zA-Z0-9_^{}]*)*,\s*\\dots\s*,\s*[a-zA-Z0-9_^{}]+)\b/g, (m) => `$${m.trim()}$`);

                                // Named macros: \mathcal{O}(N), etc.
                                l = l.replace(/(\\(?:mathcal|mathbf|operatorname)\{[a-zA-Z0-9]+\}(?:\([^\)]+\))?)/g, (m) => `$${m}$`);
                                l = l.replace(/(\\(?:sum|prod|int)(?:_[a-zA-Z0-9{}=]+)?(?:\^[a-zA-Z0-9{}]+)?)/g, (m) => `$${m}$`);
                                l = l.replace(/(\\(?:frac|binom)\{[^{}]*\}\{[^{}]*\})/g, (m) => `$${m}$`);

                                // In-sentence comparisons with \le, \ge: "1 \le n \le 10^5"
                                l = l.replace(/(?<!\$)\b([0-9a-zA-Z_^{}]+\s*\\(?:le|ge|cdot|times|neq)\s*[0-9a-zA-Z\\_^{}\s,.<>=+\-*\/^]+?)(?=[.,;:\s]?(?:\s+[a-zA-Z]{3,}|$|\.\s))/g, (m) => {
                                    const tr = m.trim();
                                    if (tr.includes('$')) return m;
                                    return `$${tr}$`;
                                });
                            }
                            return l;
                        });
                        parts[i] = processedLines.join('\n');
                    }

                    return parts.join('');
                },

                typesetMathJax(targetEl = null) {
                    this.$nextTick(() => {
                        setTimeout(() => {
                            if (window.MathJax && window.MathJax.typesetPromise) {
                                try {
                                    if (window.MathJax.typesetClear) {
                                        if (targetEl) window.MathJax.typesetClear([targetEl]);
                                        else window.MathJax.typesetClear();
                                    }
                                    if (targetEl) {
                                        window.MathJax.typesetPromise([targetEl]).catch(() => {});
                                    } else {
                                        window.MathJax.typesetPromise().catch(() => {});
                                    }
                                } catch(e) {}
                            }
                        }, 50);
                    });
                },

                // ==========================================
                // Competitive Programming (TLX / CP) Methods
                // ==========================================
                initCpEditor() {
                    if (!this.activeNode || this.activeNode.type !== 'pemrograman') return;

                    // Clean up any existing editor instance
                    if (this.cpState.editorInstance) {
                        try {
                            this.cpState.editorInstance.destroy();
                        } catch(e) {}
                        this.cpState.editorInstance = null;
                        this.cpState.editorReady = false;
                    }

                    const studentId = this.getStudentId();
                    const courseId = this.courseData ? this.courseData.id : 'draft';
                    const lastLang = localStorage.getItem('cp_last_lang_' + studentId + '_' + courseId + '_' + this.activeNode.id) ||
                                     localStorage.getItem('cp_last_lang_' + courseId + '_' + this.activeNode.id);
                    if (lastLang) {
                        this.cpState.selectedLang = lastLang;
                    } else if (this.activeNode.starterCodes) {
                        const available = Object.keys(this.activeNode.starterCodes).find(k => this.activeNode.starterCodes[k] && this.activeNode.starterCodes[k].trim().length > 0);
                        if (available) this.cpState.selectedLang = available;
                    }

                    // Reset console output and state for new problem
                    this.cpState.customOutput = '';
                    this.cpState.customStderr = '';
                    this.cpState.customTimeMs = 0;
                    this.cpState.sampleResults = [];
                    this.cpState.showEditorialSpoiler = false;

                    // Set initial custom input to sample input 1 if customInput is empty
                    const initialSamples = this.activeNode.sampleCases || this.activeNode.samples || [];
                    if (initialSamples.length > 0 && !this.cpState.customInput) {
                        this.cpState.customInput = initialSamples[0].input || '';
                    }

                    this.loadCpSubmissions();

                    // Pre-load saved code or boilerplate into currentCode so fallback textarea is immediately populated
                    const key = 'cp_code_' + studentId + '_' + courseId + '_' + this.activeNode.id + '_' + this.cpState.selectedLang;
                    const legacyKey = 'cp_code_' + courseId + '_' + this.activeNode.id + '_' + this.cpState.selectedLang;
                    let savedCode = localStorage.getItem(key) || localStorage.getItem(legacyKey);
                    
                    // Fallback to cloud draft from database if not in local storage
                    if (!savedCode && this.cloudCpDrafts) {
                        const draftKey = `${courseId}_${this.activeNode.id}_${this.cpState.selectedLang}`;
                        if (this.cloudCpDrafts[draftKey] && this.cloudCpDrafts[draftKey].code) {
                            savedCode = this.cloudCpDrafts[draftKey].code;
                        }
                    }

                    if (savedCode === null || savedCode === undefined) {
                        if (this.activeNode.starterCodes && this.activeNode.starterCodes[this.cpState.selectedLang]) {
                            savedCode = this.activeNode.starterCodes[this.cpState.selectedLang];
                        } else {
                            savedCode = this.getDefaultBoilerplate(this.cpState.selectedLang);
                        }
                    }
                    this.cpState.currentCode = savedCode || '';

                    // Robust retry loop to mount Ace when the DOM node is ready
                    let attempts = 0;
                    const maxAttempts = 30;
                    const mountAce = () => {
                        const editorEl = document.getElementById('cp-ace-editor');
                        if (!editorEl || typeof ace === 'undefined') {
                            if (++attempts < maxAttempts) {
                                setTimeout(mountAce, 60);
                            }
                            return;
                        }

                        try {
                            const editor = ace.edit('cp-ace-editor');
                            editor.setTheme('ace/theme/one_dark');
                            editor.setFontSize(14);
                            editor.setShowPrintMargin(false);
                            editor.session.setUseSoftTabs(true);
                            editor.session.setTabSize(4);
                            editor.setReadOnly(false);
                            editor.setOptions({
                                enableBasicAutocompletion: true,
                                enableLiveAutocompletion: true,
                                enableSnippets: true,
                                showLineNumbers: true
                            });

                            editor.selection.on('changeCursor', () => {
                                const pos = editor.getCursorPosition();
                                this.cpState.cursorPos = { row: pos.row + 1, col: pos.column + 1 };
                            });

                            editor.on('change', () => {
                                if (!this.activeNode || this.activeNode.type !== 'pemrograman') return;
                                const val = editor.getValue();
                                this.cpState.currentCode = val;
                                const currentLang = this.cpState.selectedLang;
                                const cId = this.courseData ? this.courseData.id : 'draft';
                                const sId = this.getStudentId();
                                const saveKey = 'cp_code_' + sId + '_' + cId + '_' + this.activeNode.id + '_' + currentLang;
                                try {
                                    localStorage.setItem(saveKey, val);
                                } catch(e) {}
                                this.debounceSaveCpDraft(val, currentLang);
                            });

                            this.cpState.editorInstance = editor;
                            this.cpState.editorReady = true;
                            this.updateEditorLangAndCode();

                            setTimeout(() => {
                                editor.resize(true);
                                editor.renderer.updateFull();
                                editor.focus();
                            }, 100);
                        } catch(err) {
                            console.warn('Gagal memuat Ace editor, menggunakan textarea interaktif:', err);
                            this.cpState.editorReady = false;
                        }
                    };

                    mountAce();
                },

                onTextareaCodeChange(val) {
                    this.cpState.currentCode = val;
                    if (this.activeNode) {
                        const sId = this.getStudentId();
                        const courseId = this.courseData ? this.courseData.id : 'draft';
                        const key = 'cp_code_' + sId + '_' + courseId + '_' + this.activeNode.id + '_' + this.cpState.selectedLang;
                        try {
                            localStorage.setItem(key, val);
                        } catch(e) {}
                        this.debounceSaveCpDraft(val, this.cpState.selectedLang);
                    }
                },

                getCurrentCpCode() {
                    if (this.cpState.editorInstance && this.cpState.editorReady) {
                        try {
                            const val = this.cpState.editorInstance.getValue();
                            if (val !== undefined && val !== null) {
                                this.cpState.currentCode = val;
                                return val;
                            }
                        } catch(e) {}
                    }
                    return this.cpState.currentCode || '';
                },

                updateEditorLangAndCode() {
                    if (!this.activeNode) return;
                    const lang = this.cpState.selectedLang;
                    const sId = this.getStudentId();
                    const courseId = this.courseData ? this.courseData.id : 'draft';
                    const key = 'cp_code_' + sId + '_' + courseId + '_' + this.activeNode.id + '_' + lang;
                    const legacyKey = 'cp_code_' + courseId + '_' + this.activeNode.id + '_' + lang;

                    let savedCode = localStorage.getItem(key) || localStorage.getItem(legacyKey);
                    if (!savedCode && this.cloudCpDrafts) {
                        const draftKey = `${courseId}_${this.activeNode.id}_${lang}`;
                        if (this.cloudCpDrafts[draftKey] && this.cloudCpDrafts[draftKey].code) {
                            savedCode = this.cloudCpDrafts[draftKey].code;
                        }
                    }

                    if (savedCode === null || savedCode === undefined) {
                        if (this.activeNode.starterCodes && this.activeNode.starterCodes[lang]) {
                            savedCode = this.activeNode.starterCodes[lang];
                        } else {
                            savedCode = this.getDefaultBoilerplate(lang);
                        }
                    }
                    this.cpState.currentCode = savedCode || '';

                    if (this.cpState.editorInstance && this.cpState.editorReady) {
                        let mode = 'ace/mode/c_cpp';
                        if (lang === 'python') mode = 'ace/mode/python';
                        else if (lang === 'pascal') mode = 'ace/mode/pascal';
                        else if (lang === 'java') mode = 'ace/mode/java';
                        this.cpState.editorInstance.session.setMode(mode);
                        this.cpState.editorInstance.setValue(this.cpState.currentCode, -1);
                        this.cpState.editorInstance.resize(true);
                        this.cpState.editorInstance.focus();
                    }
                },

                onLangChange() {
                    if (!this.activeNode) return;
                    const sId = this.getStudentId();
                    const courseId = this.courseData ? this.courseData.id : 'draft';
                    localStorage.setItem('cp_last_lang_' + sId + '_' + courseId + '_' + this.activeNode.id, this.cpState.selectedLang);
                    this.updateEditorLangAndCode();
                },

                getDefaultBoilerplate(lang) {
                    if (lang === 'cpp17' || lang === 'cpp20' || lang === 'cpp') {
                        return `#include <iostream>\nusing namespace std;\n\nint main() {\n    ios_base::sync_with_stdio(false);\n    cin.tie(NULL);\n    \n    // Tulis kode solusi Anda di sini\n    \n    return 0;\n}\n`;
                    }
                    if (lang === 'c') {
                        return `#include <stdio.h>\n\nint main() {\n    // Tulis kode solusi Anda di sini\n    return 0;\n}\n`;
                    }
                    if (lang === 'python' || lang === 'python3') {
                        return `import sys\n\ndef main():\n    # Tulis kode solusi Anda di sini\n    pass\n\nif __name__ == '__main__':\n    main()\n`;
                    }
                    if (lang === 'pascal') {
                        return `var\n    // Deklarasi variabel di sini\nbegin\n    // Tulis kode solusi Anda di sini\nend.\n`;
                    }
                    if (lang === 'java') {
                        return `import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        // Tulis kode solusi Anda di sini\n    }\n}\n`;
                    }
                    return '';
                },

                resetCpCode() {
                    if (!this.activeNode) return;
                    if (!confirm('Kembalikan kode ke template awal untuk bahasa ini? Perubahan kode Anda saat ini akan direset.')) return;
                    const lang = this.cpState.selectedLang;
                    const starter = (this.activeNode.starterCodes && this.activeNode.starterCodes[lang]) ? this.activeNode.starterCodes[lang] : this.getDefaultBoilerplate(lang);
                    this.cpState.currentCode = starter;
                    if (this.cpState.editorInstance && this.cpState.editorReady) {
                        this.cpState.editorInstance.setValue(starter, -1);
                        this.cpState.editorInstance.focus();
                    }
                    const sId = this.getStudentId();
                    const courseId = this.courseData ? this.courseData.id : 'draft';
                    localStorage.setItem('cp_code_' + sId + '_' + courseId + '_' + this.activeNode.id + '_' + lang, starter);
                    this.debounceSaveCpDraft(starter, lang);
                },

                async runCpCustom() {
                    if (!this.activeNode) return;
                    const code = this.getCurrentCpCode();
                    if (!code.trim()) {
                        alert('Tulis kode solusi terlebih dahulu!');
                        return;
                    }

                    this.cpState.isRunningCustom = true;
                    this.cpState.activeConsoleTab = 'custom';
                    this.cpState.customOutput = '';
                    this.cpState.customStderr = '';
                    this.cpState.customTimeMs = 0;

                    try {
                        const res = await fetch('/api/code-runner', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                code: code,
                                language: this.cpState.selectedLang,
                                mode: 'custom',
                                action: 'run_custom',
                                customInput: this.cpState.customInput || '',
                                stdin: this.cpState.customInput || '',
                                timeLimit: this.activeNode.timeLimit || 1,
                                memoryLimit: this.activeNode.memoryLimit || 256
                            })
                        });
                        const data = await res.json();
                        if (data.success) {
                            this.cpState.customOutput = data.output || '';
                            this.cpState.customStderr = data.stderr || data.errorOutput || data.compileError || data.compilerError || '';
                            this.cpState.customTimeMs = data.executionTimeMs || data.timeMs || 0;
                        } else {
                            this.cpState.customStderr = data.message || 'Gagal mengeksekusi kode.';
                        }
                    } catch(err) {
                        this.cpState.customStderr = 'Kesalahan jaringan: ' + err.message;
                    }
                    this.cpState.isRunningCustom = false;
                },

                async runCpSamples() {
                    if (!this.activeNode) return;
                    const code = this.getCurrentCpCode();
                    if (!code.trim()) {
                        alert('Tulis kode solusi terlebih dahulu!');
                        return;
                    }
                    const sampleCasesList = this.activeNode.sampleCases || this.activeNode.samples || [];
                    if (sampleCasesList.length === 0) {
                        alert('Soal ini tidak memiliki kasus contoh.');
                        return;
                    }

                    this.cpState.isRunningSamples = true;
                    this.cpState.activeConsoleTab = 'samples';
                    this.cpState.sampleResults = [];

                    try {
                        const res = await fetch('/api/code-runner', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                code: code,
                                language: this.cpState.selectedLang,
                                mode: 'samples',
                                action: 'run_samples',
                                sampleCases: sampleCasesList,
                                samples: sampleCasesList,
                                timeLimit: this.activeNode.timeLimit || 1,
                                memoryLimit: this.activeNode.memoryLimit || 256
                            })
                        });
                        const data = await res.json();
                        if (data.success) {
                            this.cpState.sampleResults = data.sampleResults || data.samples || [];
                        } else {
                            alert('Gagal menguji kasus contoh: ' + (data.message || 'Unknown error'));
                        }
                    } catch(err) {
                        alert('Kesalahan koneksi: ' + err.message);
                    }
                    this.cpState.isRunningSamples = false;
                },

                async submitCpSolution() {
                    if (!this.activeNode) return;
                    const code = this.getCurrentCpCode();
                    if (!code.trim()) {
                        alert('Tulis kode solusi sebelum mengumpulkan!');
                        return;
                    }

                    this.cpState.isSubmitting = true;
                    this.cpState.activeConsoleTab = 'verdict';
                    this.cpState.activeTab = 'code';

                    const courseId = this.courseData ? this.courseData.id : 'draft';
                    const sessionRaw = localStorage.getItem('nls_student_auth_session') || localStorage.getItem('nls_auth_session');
                    let userId = 'guest';
                    let userName = 'Siswa NLS';
                    if (sessionRaw) {
                        try {
                            const sess = JSON.parse(sessionRaw);
                            if (sess.id) userId = sess.id;
                            if (sess.name || sess.email) userName = sess.name || sess.email;
                        } catch(e) {}
                    }

                    try {
                        const payload = {
                            code: code,
                            language: this.cpState.selectedLang,
                            mode: 'submit',
                            action: 'submit',
                            problemId: this.activeNode.id,
                            moduleId: this.activeNode.id,
                            problemTitle: this.activeNode.title || 'Soal Pemrograman',
                            courseId: courseId,
                            userId: userId,
                            userName: userName,
                            cpMode: this.activeNode.cpMode || (this.activeNode.sourcePlatform ? 'vjudge' : 'manual'),
                            judgeProvider: this.activeNode.judgeProvider || (this.activeNode.sourcePlatform ? this.activeNode.sourcePlatform.toLowerCase() : 'manual'),
                            sourcePlatform: this.activeNode.sourcePlatform || '',
                            sourceUrl: this.activeNode.sourceUrl || this.activeNode.remoteJudgeUrl || '',
                            testCases: this.activeNode.testCases || [],
                            sampleCases: this.activeNode.sampleCases || this.activeNode.samples || [],
                            timeLimit: this.activeNode.timeLimit || 1,
                            memoryLimit: this.activeNode.memoryLimit || 256
                        };

                        let data = null;
                        const isVJudge = payload.cpMode === 'vjudge' || 
                            ['tlx', 'cses', 'atcoder', 'codeforces'].includes(payload.judgeProvider) ||
                            (payload.sourcePlatform && ['tlx', 'cses', 'atcoder', 'codeforces'].includes(payload.sourcePlatform.toLowerCase())) ||
                            (payload.sourceUrl && (payload.sourceUrl.includes('tlx.toki.id') || payload.sourceUrl.includes('cses.fi') || payload.sourceUrl.includes('atcoder.jp') || payload.sourceUrl.includes('codeforces.com')));

                        if (isVJudge) {
                            let targetPlat = 'tlx';
                            let platName = 'TLX TOKI';
                            const srcLow = (payload.sourceUrl || '').toLowerCase();
                            const provLow = (payload.judgeProvider || (payload.sourcePlatform || '')).toLowerCase();

                            if (provLow === 'codeforces' || srcLow.includes('codeforces.com') || /^\d+[a-za-z][a-za-z0-9]*$/.test(srcLow.trim())) {
                                targetPlat = 'codeforces';
                                platName = 'Codeforces';
                            } else if (provLow === 'atcoder' || srcLow.includes('atcoder.jp')) {
                                targetPlat = 'atcoder';
                                platName = 'AtCoder';
                            } else if (provLow === 'cses' || srcLow.includes('cses.fi')) {
                                targetPlat = 'cses';
                                platName = 'CSES';
                            } else if (provLow === 'tlx' || srcLow.includes('tlx.toki.id') || /^(troc|osn|ksn|toki)-/i.test(srcLow.trim())) {
                                targetPlat = 'tlx';
                                platName = 'TLX TOKI';
                            } else {
                                this.cpState.isSubmitting = false;
                                alert('Platform VJudge tidak didukung. Mode VJudge saat ini hanya menerima 4 Online Judge resmi: TLX TOKI, CSES, AtCoder, dan Codeforces.');
                                return;
                            }

                            const judgeHost = localStorage.getItem('nls_remote_judge_url') || 'https://nls-blog-production.up.railway.app';
                            try {
                                const directSubmitRes = await fetch(`${judgeHost}/api/judge/submit`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        platform: targetPlat,
                                        problemUrl: payload.sourceUrl || payload.problemTitle,
                                        language: payload.language,
                                        sourceCode: payload.code,
                                        studentId: payload.userId || payload.userName
                                    })
                                });

                                if (directSubmitRes.ok) {
                                    const directSubmitData = await directSubmitRes.json().catch(() => ({}));
                                    if (directSubmitData.success && directSubmitData.jobId) {
                                        const jobId = directSubmitData.jobId;
                                        const startT = Date.now();
                                        while (Date.now() - startT < 85000) {
                                            await new Promise(r => setTimeout(r, 2000));
                                            const stRes = await fetch(`${judgeHost}/api/judge/status/${jobId}`).catch(() => null);
                                            if (stRes && stRes.ok) {
                                                const stData = await stRes.json().catch(() => ({}));
                                                if (stData.success && stData.job && (stData.job.status === 'completed' || stData.job.status === 'failed')) {
                                                    const r = stData.job.result || {};
                                                    const v = r.verdict || (stData.job.status === 'failed' ? (stData.job.error || 'Evaluation Failed') : 'Accepted');
                                                    let vCode = 'WA';
                                                    if (/Accepted|Diterima/i.test(v)) vCode = 'AC';
                                                    else if (/Wrong Answer/i.test(v)) vCode = 'WA';
                                                    else if (/Time Limit/i.test(v)) vCode = 'TLE';
                                                    else if (/Memory Limit/i.test(v)) vCode = 'MLE';
                                                    else if (/Compilation Error/i.test(v)) vCode = 'CE';
                                                    else if (/Runtime Error/i.test(v)) vCode = 'RTE';
                                                    const sc = Number(r.score) !== undefined ? Number(r.score) : (vCode === 'AC' ? 100 : 0);

                                                    let testsArr = [];
                                                    if (Array.isArray(r.tests) && r.tests.length > 0) {
                                                        testsArr = r.tests.map((t, idx) => ({
                                                            index: t.index || (idx + 1),
                                                            label: t.label || `Kasus Uji #${idx + 1}`,
                                                            verdict: t.verdictCode || (t.passed ? 'AC' : 'WA'),
                                                            verdictCode: t.verdictCode || (t.passed ? 'AC' : 'WA'),
                                                            verdictName: t.verdictName || (t.passed ? 'Accepted' : 'Wrong Answer'),
                                                            passed: Boolean(t.passed),
                                                            points: t.points !== undefined ? t.points : (t.passed ? Math.floor(100 / r.tests.length) : 0),
                                                            maxPoints: t.maxPoints || 100,
                                                            executionTimeMs: t.executionTimeMs || 0
                                                        }));
                                                    } else {
                                                        testsArr = [
                                                            {
                                                                index: 1,
                                                                label: `Evaluasi Resmi Server ${platName}`,
                                                                verdict: vCode,
                                                                verdictCode: vCode,
                                                                verdictName: v,
                                                                passed: vCode === 'AC',
                                                                points: sc,
                                                                maxPoints: 100,
                                                                executionTimeMs: 0
                                                            }
                                                        ];
                                                    }

                                                    data = {
                                                        success: true,
                                                        score: sc,
                                                        totalScore: 100,
                                                        totalPoints: 100,
                                                        verdict: vCode,
                                                        verdictCode: vCode,
                                                        verdictName: `${v} (${platName} Official)`,
                                                        timeMs: r.time || 'N/A',
                                                        memoryKb: r.memory || 'N/A',
                                                        maxTimeMs: r.maxTimeMs || 0,
                                                        maxMemoryKb: 262144,
                                                        isRemoteJudge: true,
                                                        remotePlatform: platName,
                                                        submissionId: jobId,
                                                        testResults: testsArr,
                                                        tests: testsArr
                                                    };
                                                    break;
                                                }
                                            }
                                        }
                                    }
                                }
                            } catch (directErr) {
                                console.warn('[LMS Player] Direct connection to remote judge error:', directErr);
                            }

                            if (!data) {
                                data = {
                                    success: false,
                                    verdict: 'OFFLINE',
                                    verdictCode: 'OFFLINE',
                                    verdictName: 'Server Grader Offline',
                                    score: 0,
                                    totalScore: 100,
                                    message: `Layanan Remote Judge [${platName}] sedang offline atau belum terhubung. Mode VJudge mewajibkan evaluasi resmi langsung dari server ${platName} agar seluruh kasus uji rahasia (secret test cases) teruji secara autentik.`
                                };
                            }
                        } else {
                            // Mode Manual / Sandbox lokal untuk soal latihan modul biasa
                            const res = await fetch('/api/code-runner', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            }).catch(() => null);

                            if (res && res.ok) {
                                data = await res.json().catch(() => null);
                            }
                        }

                        if (data && data.success) {
                            this.cpState.lastVerdict = data;

                            // Add to submissions history
                            const submissionRecord = {
                                id: data.submissionId || ('sub_' + Date.now().toString(36)),
                                courseId: courseId,
                                moduleId: this.activeNode.id,
                                problemId: this.activeNode.id,
                                language: this.cpState.selectedLang,
                                verdict: data.verdict || data.verdictCode,
                                score: data.score,
                                totalScore: data.totalScore || 100,
                                timeMs: data.maxTimeMs || 0,
                                memoryKb: data.maxMemoryKb || 256 * 1024,
                                date: new Date().toLocaleString('id-ID'),
                                code: code,
                                details: data.testResults || data.tests || []
                            };
                            this.cpState.submissions.unshift(submissionRecord);

                            const sId = this.getStudentId();
                            try {
                                localStorage.setItem('cp_submissions_' + sId + '_' + courseId + '_' + this.activeNode.id, JSON.stringify(this.cpState.submissions.slice(0, 30)));
                            } catch(e) {}

                            // Save submission to PostgreSQL Cloud DB per student
                            if (sId !== 'guest') {
                                fetch('/api/pg-lms', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        action: 'save_cp_submission',
                                        userId: sId,
                                        courseId: courseId,
                                        moduleId: this.activeNode.id,
                                        submission: submissionRecord,
                                        code: code,
                                        language: this.cpState.selectedLang
                                    })
                                }).catch(() => {});
                            }

                            // Update best score
                            if (data.score > (this.cpState.bestScore || 0)) {
                                this.cpState.bestScore = data.score;
                                this.cpState.bestVerdict = data.verdict || data.verdictCode;
                            }

                            // If AC 100, trigger confetti and mark module as completed!
                            if ((data.verdict === 'AC' || data.verdictCode === 'AC') && data.score === 100) {
                                if (typeof confetti === 'function') {
                                    confetti({
                                        particleCount: 120,
                                        spread: 80,
                                        origin: { y: 0.6 }
                                    });
                                }
                                this.markAsCompleted(this.activeNode.id);
                            }
                        } else if (data && (data.verdict === 'OFFLINE' || data.verdictCode === 'OFFLINE')) {
                            this.cpState.lastVerdict = data;
                            alert(data.message || 'Layanan Remote Judge sedang offline.');
                        } else {
                            alert('Gagal menilai solusi: ' + (data.message || 'Unknown error'));
                        }
                    } catch(err) {
                        alert('Gagal menghubungi server penilaian: ' + err.message);
                    }
                    this.cpState.isSubmitting = false;
                },

                loadCpSubmissions() {
                    if (!this.activeNode) return;
                    const sId = this.getStudentId();
                    const courseId = this.courseData ? this.courseData.id : 'draft';
                    const key = 'cp_submissions_' + sId + '_' + courseId + '_' + this.activeNode.id;
                    const legacyKey = 'cp_submissions_' + courseId + '_' + this.activeNode.id;
                    
                    let localSubs = [];
                    try {
                        const raw = localStorage.getItem(key) || localStorage.getItem(legacyKey);
                        if (raw) localSubs = JSON.parse(raw) || [];
                    } catch(e) {}

                    // Merge with cloud submissions from PostgreSQL DB
                    let cloudSubs = [];
                    if (Array.isArray(this.cloudCpSubmissions)) {
                        cloudSubs = this.cloudCpSubmissions.filter(s => {
                            return (s.courseId === courseId || !s.courseId) && (s.moduleId === this.activeNode.id || s.problemId === this.activeNode.id);
                        });
                    }

                    // Deduplicate by ID
                    const mergedMap = new Map();
                    [...localSubs, ...cloudSubs].forEach(s => {
                        if (s && s.id && !mergedMap.has(s.id)) {
                            mergedMap.set(s.id, s);
                        }
                    });

                    const merged = Array.from(mergedMap.values());
                    this.cpState.submissions = merged;

                    let maxSc = 0;
                    let bestV = null;
                    merged.forEach(s => {
                        if (s.score >= maxSc) {
                            maxSc = s.score;
                            bestV = s.verdict;
                        }
                    });
                    this.cpState.bestScore = maxSc;
                    this.cpState.bestVerdict = bestV;
                    if (maxSc === 100 && !this.isCompleted(this.activeNode.id)) {
                        this.markAsCompleted(this.activeNode.id);
                    }
                },

                copySampleInput(input, idx) {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(input).then(() => {
                            this.cpState.copiedSampleIdx = idx;
                            setTimeout(() => { this.cpState.copiedSampleIdx = null; }, 2000);
                        }).catch(() => {
                            this.fallbackCopy(input);
                            this.cpState.copiedSampleIdx = idx;
                            setTimeout(() => { this.cpState.copiedSampleIdx = null; }, 2000);
                        });
                    } else {
                        this.fallbackCopy(input);
                        this.cpState.copiedSampleIdx = idx;
                        setTimeout(() => { this.cpState.copiedSampleIdx = null; }, 2000);
                    }
                },

                fallbackCopy(text) {
                    const t = document.createElement('textarea');
                    t.value = text;
                    t.style.position = 'fixed';
                    t.style.opacity = '0';
                    document.body.appendChild(t);
                    t.focus();
                    t.select();
                    try { document.execCommand('copy'); } catch(e) {}
                    document.body.removeChild(t);
                },

                useSampleAsCustomInput(input) {
                    this.cpState.customInput = input;
                    this.cpState.activeConsoleTab = 'custom';
                    this.cpState.activeTab = 'code';
                    const el = document.getElementById('cp-console-anchor');
                    if (el) el.scrollIntoView({ behavior: 'smooth' });
                },

                viewSubmissionCode(sub) {
                    this.cpState.viewingSubmission = sub;
                    this.cpState.showCodeModal = true;
                },

                loadSubmittedCodeToEditor(code) {
                    this.cpState.currentCode = code;
                    if (this.cpState.editorInstance && this.cpState.editorReady) {
                        this.cpState.editorInstance.setValue(code, -1);
                    }
                    this.cpState.showCodeModal = false;
                    this.cpState.activeTab = 'code';
                    const sId = this.getStudentId();
                    const cId = this.courseData ? this.courseData.id : 'draft';
                    if (this.activeNode) {
                        localStorage.setItem('cp_code_' + sId + '_' + cId + '_' + this.activeNode.id + '_' + this.cpState.selectedLang, code);
                    }
                    this.debounceSaveCpDraft(code, this.cpState.selectedLang);
                    const el = document.getElementById('cp-ace-editor');
                    if (el) el.scrollIntoView({ behavior: 'smooth' });
                },

                copyToClipboard(text) {
                    if (navigator.clipboard && navigator.clipboard.writeText && text) {
                        navigator.clipboard.writeText(text).then(() => {
                            alert('Tersalin ke clipboard!');
                        }).catch(() => {
                            this.fallbackCopy(text);
                            alert('Tersalin ke clipboard!');
                        });
                    } else if (text) {
                        this.fallbackCopy(text);
                        alert('Tersalin ke clipboard!');
                    }
                },

                // ==========================================
                // Problem Statement Translation Methods (LaTeX & Code Preserving)
                // ==========================================
                async toggleTranslateProblem() {
                    if (!this.activeNode) return;

                    // Toggle off if already translated
                    if (this.cpState.isTranslated) {
                        this.cpState.isTranslated = false;
                        this.typesetMathJax();
                        return;
                    }

                    const nodeId = this.activeNode.id || 'current_node';

                    // Check if already in cache
                    if (this.cpState.translatedCache && this.cpState.translatedCache[nodeId]) {
                        this.cpState.isTranslated = true;
                        this.typesetMathJax();
                        return;
                    }

                    this.cpState.translating = true;
                    try {
                        const isPemrograman = this.activeNode.type === 'pemrograman';
                        const segments = isPemrograman ? {
                            description: this.activeNode.problemDescription || this.activeNode.rawHtml || '',
                            inputFormat: this.activeNode.inputFormat || '',
                            outputFormat: this.activeNode.outputFormat || '',
                            constraints: this.activeNode.constraints || '',
                            editorial: this.activeNode.editorial || ''
                        } : {
                            description: this.activeNode.rawHtml || this.activeNode.content || ''
                        };

                        let translated = null;

                        // Primary: /api/pg-lms
                        try {
                            const res = await fetch('/api/pg-lms', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    action: 'translate_problem',
                                    segments: segments,
                                    targetLang: 'id',
                                    sourceLang: 'en'
                                })
                            });
                            if (res.ok) {
                                const data = await res.json();
                                if (data && data.success && data.segments) {
                                    translated = data.segments;
                                }
                            }
                        } catch(e) {}

                        // Fallback: /api/translate
                        if (!translated) {
                            try {
                                const res2 = await fetch('/api/translate', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ segments, targetLang: 'id', sourceLang: 'en' })
                                });
                                if (res2.ok) {
                                    const data2 = await res2.json();
                                    if (data2 && data2.success && data2.segments) {
                                        translated = data2.segments;
                                    }
                                }
                            } catch(e) {}
                        }

                        if (translated) {
                            if (!this.cpState.translatedCache) this.cpState.translatedCache = {};
                            this.cpState.translatedCache[nodeId] = {
                                ...translated,
                                materi: translated.description
                            };
                            this.cpState.isTranslated = true;
                            this.typesetMathJax();
                        } else {
                            alert('Gagal menerjemahkan konten saat ini. Silakan coba kembali sesaat lagi.');
                        }
                    } catch(err) {
                        console.error('Translation error:', err);
                        alert('Terjadi kendala saat menerjemahkan: ' + (err.message || 'Error'));
                    } finally {
                        this.cpState.translating = false;
                    }
                },

                getDisplayedMateriHtml() {
                    if (!this.activeNode) return '';
                    const nodeId = this.activeNode.id || 'current_node';
                    if (this.cpState.isTranslated && this.cpState.translatedCache && this.cpState.translatedCache[nodeId] && this.cpState.translatedCache[nodeId].materi) {
                        return this.cpState.translatedCache[nodeId].materi;
                    }
                    return this.activeNode.rawHtml || this.activeNode.content || '';
                },

                getDisplayedDescription() {
                    if (!this.activeNode) return '';
                    const nodeId = this.activeNode.id || 'current_node';
                    if (this.cpState.isTranslated && this.cpState.translatedCache && this.cpState.translatedCache[nodeId] && this.cpState.translatedCache[nodeId].description) {
                        return this.cpState.translatedCache[nodeId].description;
                    }
                    return this.activeNode.problemDescription || this.activeNode.rawHtml || 'Deskripsi soal belum tersedia.';
                },

                getDisplayedInputFormat() {
                    if (!this.activeNode) return '';
                    const nodeId = this.activeNode.id || 'current_node';
                    if (this.cpState.isTranslated && this.cpState.translatedCache && this.cpState.translatedCache[nodeId] && this.cpState.translatedCache[nodeId].inputFormat) {
                        return this.cpState.translatedCache[nodeId].inputFormat;
                    }
                    return this.activeNode.inputFormat || '';
                },

                getDisplayedOutputFormat() {
                    if (!this.activeNode) return '';
                    const nodeId = this.activeNode.id || 'current_node';
                    if (this.cpState.isTranslated && this.cpState.translatedCache && this.cpState.translatedCache[nodeId] && this.cpState.translatedCache[nodeId].outputFormat) {
                        return this.cpState.translatedCache[nodeId].outputFormat;
                    }
                    return this.activeNode.outputFormat || '';
                },

                getDisplayedConstraints() {
                    if (!this.activeNode) return '';
                    const nodeId = this.activeNode.id || 'current_node';
                    if (this.cpState.isTranslated && this.cpState.translatedCache && this.cpState.translatedCache[nodeId] && this.cpState.translatedCache[nodeId].constraints) {
                        return this.cpState.translatedCache[nodeId].constraints;
                    }
                    return this.activeNode.constraints || '';
                },

                getDisplayedEditorial() {
                    if (!this.activeNode) return '';
                    const nodeId = this.activeNode.id || 'current_node';
                    if (this.cpState.isTranslated && this.cpState.translatedCache && this.cpState.translatedCache[nodeId] && this.cpState.translatedCache[nodeId].editorial) {
                        return this.cpState.translatedCache[nodeId].editorial;
                    }
                    return this.activeNode.editorial || '';
                }
            }
        }
    </script>
