<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Player - NLS Belajar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .player-scroll::-webkit-scrollbar { width: 6px; }
        .player-scroll::-webkit-scrollbar-track { background: transparent; }
        .player-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .prose img { border-radius: 0.75rem; max-width: 100%; height: auto; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen overflow-hidden flex flex-col" x-data="lmsPlayer()" x-init="init()">
    
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-4 sm:px-6 shrink-0 shadow-sm z-20 relative">
        <div class="flex items-center gap-3">
            <a href="index.html" class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </a>
            <div>
                <h1 class="font-black text-sm sm:text-base text-slate-900 leading-tight" x-text="courseData ? courseData.title : 'Program Belajar NLS'"></h1>
                <p class="text-[10px] sm:text-xs text-slate-500 font-medium">Progress: <span class="text-indigo-600 font-bold" x-text="getProgress() + '%'"></span></p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <div class="hidden sm:flex items-center gap-2 text-xs font-bold px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-100">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Mode Belajar Aktif
            </div>
            <button @click="sidebarOpen = !sidebarOpen" class="md:hidden p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">
        
        <!-- Sidebar -->
        <aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'" class="absolute md:relative z-10 w-72 h-full bg-white border-r border-slate-200 shadow-xl md:shadow-none transition-transform duration-300 md:translate-x-0 flex flex-col shrink-0">
            <div class="p-4 border-b border-slate-100 bg-slate-50 flex items-center justify-between">
                <h2 class="text-xs font-black uppercase tracking-wider text-slate-700">Daftar Materi</h2>
                <button @click="sidebarOpen = false" class="md:hidden text-slate-400 hover:text-rose-500">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto player-scroll p-3 space-y-3">
                <template x-if="babs.length === 0">
                    <div class="text-center p-6 text-slate-400 text-xs">Modul belum tersedia.</div>
                </template>
                <template x-for="(bab, bIdx) in babs" :key="bab.id">
                    <div class="border border-slate-200 rounded-xl bg-white overflow-hidden shadow-xs">
                        <!-- Bab Header -->
                        <button @click="bab.expanded = !bab.expanded" class="w-full bg-slate-50 hover:bg-slate-100 p-3 flex justify-between items-center transition-colors text-left">
                            <h3 class="text-xs font-black text-slate-800 pr-2" x-text="bab.title"></h3>
                            <svg class="w-4 h-4 text-slate-400 shrink-0 transition-transform duration-200" :class="bab.expanded ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        
                        <!-- Sub Babs -->
                        <div x-show="bab.expanded" class="bg-white" x-collapse>
                            <template x-for="(node, nIdx) in bab.subBabs" :key="node.id">
                                <button @click="openNode(node)" 
                                    :class="activeNode && activeNode.id === node.id ? 'bg-indigo-50/80 border-l-4 border-indigo-600' : 'border-l-4 border-transparent hover:bg-slate-50'"
                                    class="w-full flex items-start gap-3 p-3 text-left transition-all border-t border-slate-100">
                                    <div class="mt-0.5 shrink-0">
                                        <span x-show="node.type === 'materi'" class="text-blue-500 text-base">??</span>
                                        <span x-show="node.type === 'kuis'" class="text-amber-500 text-base">??</span>
                                        <span x-show="node.type === 'video'" class="text-red-500 text-base">??</span>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <h4 class="text-xs font-bold truncate transition-colors" :class="activeNode && activeNode.id === node.id ? 'text-indigo-700' : 'text-slate-700'" x-text="node.title"></h4>
                                        <div class="flex items-center gap-2 mt-1">
                                            <span class="text-[10px] text-slate-400 font-semibold flex items-center gap-1">
                                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                                <span x-text="node.duration || '15 Menit'"></span>
                                            </span>
                                            <!-- Status Indicator -->
                                            <span x-show="isCompleted(node.id)" class="text-[9px] font-black uppercase text-emerald-600 bg-emerald-100 px-1.5 py-0.5 rounded-md">Selesai</span>
                                        </div>
                                    </div>
                                </button>
                            </template>
                            <div x-show="bab.subBabs.length === 0" class="p-3 text-center text-[10px] text-slate-400 font-bold uppercase">
                                Belum ada isi
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 bg-slate-100/50 relative overflow-y-auto player-scroll flex flex-col">
            
            <template x-if="!activeNode">
                <div class="flex-1 flex flex-col items-center justify-center text-slate-400 p-6">
                    <div class="w-24 h-24 rounded-full bg-white shadow-sm flex items-center justify-center mb-5">
                        <svg class="w-12 h-12 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                    </div>
                    <h2 class="text-lg font-black text-slate-700">Pilih Materi di Samping</h2>
                    <p class="text-xs text-slate-500 mt-2 max-w-sm text-center">Silakan pilih bab atau kuis dari daftar di sebelah kiri untuk mulai belajar.</p>
                </div>
            </template>

            <template x-if="activeNode">
                <div class="w-full max-w-5xl mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
                    
                    <!-- Content Header -->
                    <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
                            <div>
                                <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider mb-3"
                                    :class="activeNode.type === 'materi' ? 'bg-blue-100 text-blue-700' : (activeNode.type === 'kuis' ? 'bg-amber-100 text-amber-700' : 'bg-red-100 text-red-700')">
                                    <span x-text="activeNode.type"></span>
                                </div>
                                <h2 class="text-2xl sm:text-3xl font-black text-slate-900 leading-tight" x-text="activeNode.title"></h2>
                            </div>
                            
                            <button @click="markAsCompleted(activeNode.id)" 
                                :class="isCompleted(activeNode.id) ? 'bg-emerald-100 text-emerald-700 border-emerald-200' : 'bg-indigo-600 text-white hover:bg-indigo-700 shadow-md'"
                                class="px-5 py-2.5 rounded-xl font-bold text-xs transition-all flex items-center justify-center gap-2 border">
                                <svg x-show="isCompleted(activeNode.id)" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                                <span x-text="isCompleted(activeNode.id) ? 'Telah Diselesaikan' : 'Tandai Selesai'"></span>
                            </button>
                        </div>
                        <p class="text-sm text-slate-500" x-text="activeNode.summary || 'Baca dan pahami materi berikut dengan saksama.'"></p>
                    </div>

                    <!-- Materi Content -->
                    <template x-if="activeNode.type === 'materi'">
                        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                            <template x-if="activeNode.materiFormat === 'pdf' && activeNode.pdfUrl">
                                <div class="w-full h-[600px] bg-slate-100">
                                    <iframe :src="activeNode.pdfUrl + '/preview'" class="w-full h-full border-0"></iframe>
                                </div>
                            </template>
                            <template x-if="activeNode.materiFormat === 'ckeditor' || activeNode.materiFormat === 'html'">
                                <div class="p-6 sm:p-10 prose prose-slate max-w-none prose-headings:font-black prose-a:text-indigo-600 prose-img:rounded-xl" x-html="activeNode.rawHtml"></div>
                            </template>
                        </div>
                    </template>

                    <!-- Video Content -->
                    <template x-if="activeNode.type === 'video'">
                        <div class="bg-black rounded-3xl shadow-sm overflow-hidden aspect-video relative flex flex-col items-center justify-center" x-init="initYoutubePlayer()">
                            <template x-if="activeNode.videoUrl">
                                <div id="yt-player-container" class="w-full h-full absolute inset-0"></div>
                            </template>
                            <template x-if="!activeNode.videoUrl">
                                <div class="text-white/50 text-sm font-bold">Link Video Belum Tersedia</div>
                            </template>

                            <!-- Interactive Quiz Overlay -->
                            <template x-if="interactiveQuiz.active">
                                <div class="absolute inset-0 z-10 bg-slate-900/90 backdrop-blur-md flex flex-col p-6 sm:p-10 overflow-y-auto">
                                    <div class="max-w-2xl w-full mx-auto bg-white rounded-3xl p-6 sm:p-8 shadow-2xl relative mt-auto mb-auto">
                                        <div class="flex items-center gap-3 mb-5 border-b border-slate-100 pb-4">
                                            <div class="w-10 h-10 rounded-full bg-red-100 text-red-600 flex items-center justify-center">
                                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
                                            </div>
                                            <div>
                                                <h3 class="font-black text-slate-800 text-lg">Kuis Interaktif</h3>
                                                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Video dijeda. Jawab untuk melanjutkan.</p>
                                            </div>
                                        </div>

                                        <div class="mb-6">
                                            <h4 class="font-bold text-slate-700 text-base leading-relaxed" x-html="interactiveQuiz.currentQ.text"></h4>
                                        </div>

                                        <!-- Render Simple PG for Interactive Quiz -->
                                        <template x-if="interactiveQuiz.currentQ.type === 'pg'">
                                            <div class="space-y-3">
                                                <template x-for="(opt, oIdx) in interactiveQuiz.currentQ.options" :key="oIdx">
                                                    <label class="flex items-start gap-3 p-3.5 rounded-xl border border-slate-200 hover:border-indigo-300 hover:bg-indigo-50/30 cursor-pointer transition-colors" :class="interactiveQuiz.answer == oIdx ? 'bg-indigo-50 border-indigo-400 ring-1 ring-indigo-400' : ''">
                                                        <input type="radio" :name="'iq_' + interactiveQuiz.currentQ.id" :value="oIdx" x-model.number="interactiveQuiz.answer" class="mt-1 w-4 h-4 text-indigo-600 border-slate-300 focus:ring-indigo-600 cursor-pointer">
                                                        <span class="text-sm text-slate-700 font-medium" x-text="opt"></span>
                                                    </label>
                                                </template>
                                            </div>
                                        </template>

                                        <template x-if="interactiveQuiz.currentQ.type !== 'pg'">
                                            <div class="p-4 bg-amber-50 rounded-xl border border-amber-200 text-amber-700 text-xs font-bold">
                                                Tipe soal ini belum didukung di Pop-up Interactive Video. Silakan gunakan Pilihan Ganda Sederhana.
                                            </div>
                                        </template>

                                        <div class="mt-8 flex justify-end gap-3">
                                            <button @click="skipInteractiveQuiz()" class="px-5 py-2.5 rounded-xl font-bold text-slate-500 hover:bg-slate-100 text-xs transition-colors">Lewati Kuis</button>
                                            <button @click="submitInteractiveQuiz()" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-black text-xs shadow-md shadow-indigo-600/30 transition-all flex items-center gap-2">
                                                Kirim Jawaban & Lanjut
                                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Quiz Content -->
                    <template x-if="activeNode.type === 'kuis'">
                        <div class="space-y-6">
                            
                            <template x-if="!quizState.submitted">
                                <div class="space-y-6">
                                    <template x-for="(q, qIdx) in activeNode.questions" :key="q.id">
                                        <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200">
                                            <div class="flex items-start justify-between gap-4 mb-4">
                                                <h3 class="text-sm sm:text-base font-bold text-slate-800 leading-relaxed">
                                                    <span class="text-indigo-600 mr-1" x-text="(qIdx + 1) + '.'"></span> 
                                                    <span x-html="q.text"></span>
                                                </h3>
                                                <span class="shrink-0 px-2.5 py-1 bg-slate-100 text-slate-500 rounded-lg text-[10px] font-black uppercase" 
                                                    x-text="q.type === 'pg' ? 'PG Tunggal' : q.type === 'pg_kompleks' ? 'PG Kompleks' : q.type === 'pg_majemuk' ? 'B/S Majemuk' : q.type === 'jodoh' ? 'Menjodohkan' : q.type === 'isian' ? 'Isian Singkat' : 'Essay'"></span>
                                            </div>

                                            <!-- PG Sederhana -->
                                            <template x-if="q.type === 'pg'">
                                                <div class="space-y-2 mt-5">
                                                    <template x-for="(opt, oIdx) in q.options" :key="oIdx">
                                                        <label class="flex items-start gap-3 p-3 rounded-xl border border-slate-200 hover:border-indigo-300 hover:bg-indigo-50/30 cursor-pointer transition-colors" :class="quizAnswers[q.id] == oIdx ? 'bg-indigo-50 border-indigo-400 ring-1 ring-indigo-400' : ''">
                                                            <input type="radio" :name="'q_' + q.id" :value="oIdx" x-model.number="quizAnswers[q.id]" class="mt-1 w-4 h-4 text-indigo-600 border-slate-300 focus:ring-indigo-600 cursor-pointer">
                                                            <span class="text-sm text-slate-700 font-medium" x-text="opt"></span>
                                                        </label>
                                                    </template>
                                                </div>
                                            </template>

                                            <!-- PG Kompleks -->
                                            <template x-if="q.type === 'pg_kompleks'">
                                                <div class="space-y-2 mt-5">
                                                    <p class="text-[11px] font-bold text-slate-500 mb-2">Pilih semua jawaban yang benar (lebih dari satu):</p>
                                                    <div x-init="if(!quizAnswers[q.id]) quizAnswers[q.id] = []"></div>
                                                    <template x-for="(opt, oIdx) in q.options" :key="oIdx">
                                                        <label class="flex items-start gap-3 p-3 rounded-xl border border-slate-200 hover:border-indigo-300 hover:bg-indigo-50/30 cursor-pointer transition-colors" :class="quizAnswers[q.id].includes(oIdx.toString()) ? 'bg-indigo-50 border-indigo-400 ring-1 ring-indigo-400' : ''">
                                                            <input type="checkbox" :value="oIdx.toString()" x-model="quizAnswers[q.id]" class="mt-1 w-4 h-4 rounded text-indigo-600 border-slate-300 focus:ring-indigo-600 cursor-pointer">
                                                            <span class="text-sm text-slate-700 font-medium" x-text="opt"></span>
                                                        </label>
                                                    </template>
                                                </div>
                                            </template>

                                            <!-- PG Majemuk (Benar/Salah) -->
                                            <template x-if="q.type === 'pg_majemuk'">
                                                <div class="mt-5 space-y-3">
                                                    <div x-init="if(!quizAnswers[q.id]) quizAnswers[q.id] = {}"></div>
                                                    <div class="grid grid-cols-12 gap-2 text-[10px] font-black uppercase text-slate-500 border-b border-slate-200 pb-2">
                                                        <div class="col-span-8">Pernyataan</div>
                                                        <div class="col-span-2 text-center text-emerald-600">Benar</div>
                                                        <div class="col-span-2 text-center text-rose-600">Salah</div>
                                                    </div>
                                                    <template x-for="(stmt, sIdx) in q.statements" :key="sIdx">
                                                        <div class="grid grid-cols-12 gap-2 items-center py-2 border-b border-slate-100 hover:bg-slate-50">
                                                            <div class="col-span-8 text-sm text-slate-700" x-text="stmt.text"></div>
                                                            <div class="col-span-2 flex justify-center">
                                                                <input type="radio" :name="'qm_' + q.id + '_' + sIdx" value="true" x-model="quizAnswers[q.id][sIdx]" class="w-4 h-4 text-emerald-500 cursor-pointer focus:ring-emerald-500 border-slate-300">
                                                            </div>
                                                            <div class="col-span-2 flex justify-center">
                                                                <input type="radio" :name="'qm_' + q.id + '_' + sIdx" value="false" x-model="quizAnswers[q.id][sIdx]" class="w-4 h-4 text-rose-500 cursor-pointer focus:ring-rose-500 border-slate-300">
                                                            </div>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>

                                            <!-- Menjodohkan -->
                                            <template x-if="q.type === 'jodoh'">
                                                <div class="mt-5">
                                                    <p class="text-[11px] font-bold text-slate-500 mb-3">Pilih pasangan yang tepat untuk setiap premis di sebelah kiri:</p>
                                                    <div x-init="
                                                        if(!quizAnswers[q.id]) quizAnswers[q.id] = {};
                                                        if(!q._shuffledRights) q._shuffledRights = [...q.pairs.map(p => p.right)].sort(() => Math.random() - 0.5);
                                                    "></div>
                                                    <div class="space-y-3">
                                                        <template x-for="(pair, pIdx) in q.pairs" :key="pIdx">
                                                            <div class="flex flex-col sm:flex-row sm:items-center gap-3">
                                                                <div class="flex-1 p-3 rounded-xl bg-slate-50 border border-slate-200 text-sm font-medium text-slate-700" x-text="pair.left"></div>
                                                                <div class="shrink-0 text-slate-300 hidden sm:block">?</div>
                                                                <select x-model="quizAnswers[q.id][pIdx]" class="flex-1 p-3 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500 font-medium bg-white cursor-pointer">
                                                                    <option value="">-- Pilih Jawaban --</option>
                                                                    <template x-for="(rightOpt, rIdx) in q._shuffledRights" :key="rIdx">
                                                                        <option :value="rightOpt" x-text="rightOpt"></option>
                                                                    </template>
                                                                </select>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>

                                            <!-- Isian Singkat -->
                                            <template x-if="q.type === 'isian'">
                                                <div class="mt-5">
                                                    <input type="text" x-model="quizAnswers[q.id]" placeholder="Ketik jawaban Anda di sini..." class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm bg-slate-50 focus:bg-white transition-colors">
                                                </div>
                                            </template>

                                            <!-- Essay / File Upload -->
                                            <template x-if="q.type === 'essai'">
                                                <div class="mt-5 space-y-3">
                                                    <textarea x-model="quizAnswers[q.id]" rows="4" placeholder="Ketik jawaban essay Anda (opsional jika mengunggah file)..." class="w-full p-4 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 text-sm bg-slate-50 focus:bg-white transition-colors"></textarea>
                                                    <div class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:bg-slate-50 transition-colors cursor-pointer relative overflow-hidden group">
                                                        <input type="file" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" @change="quizAnswers[q.id + '_file'] = \.target.files[0]?.name">
                                                        <svg class="w-8 h-8 mx-auto text-slate-400 group-hover:text-indigo-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                                                        <p class="text-sm font-bold text-slate-600" x-text="quizAnswers[q.id + '_file'] ? 'File: ' + quizAnswers[q.id + '_file'] : 'Klik atau Tarik file PDF/Dokumen ke sini'"></p>
                                                        <p class="text-[10px] text-slate-400 mt-1">Maks. 5MB. Dokumen akan dikirimkan ke pengajar untuk dinilai manual.</p>
                                                    </div>
                                                </div>
                                            </template>

                                        </div>
                                    </template>

                                    <!-- Submit Button -->
                                    <div class="flex justify-end pt-4">
                                        <button @click="submitQuiz()" class="px-8 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-black text-sm shadow-xl shadow-indigo-600/30 active:scale-95 transition-all">
                                            Kumpulkan Kuis & Lihat Nilai
                                        </button>
                                    </div>
                                </div>
                            </template>

                            <!-- Quiz Result -->
                            <template x-if="quizState.submitted">
                                <div class="bg-white rounded-3xl p-8 shadow-xl shadow-slate-200/50 border border-slate-200 text-center relative overflow-hidden">
                                    <div class="absolute top-0 left-0 w-full h-2" :class="quizState.score > 70 ? 'bg-emerald-500' : 'bg-rose-500'"></div>
                                    <div class="w-24 h-24 mx-auto rounded-full flex items-center justify-center mb-6" :class="quizState.score > 70 ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'">
                                        <span class="text-4xl font-black" x-text="quizState.score"></span>
                                    </div>
                                    <h3 class="text-2xl font-black text-slate-900 mb-2" x-text="quizState.score > 70 ? 'Luar Biasa!' : 'Tetap Semangat!'"></h3>
                                    <p class="text-slate-500 text-sm mb-8">Anda menjawab benar <strong class="text-slate-700" x-text="quizState.correct"></strong> dari <strong class="text-slate-700" x-text="quizState.total"></strong> soal.</p>
                                    
                                    <div class="flex justify-center gap-4">
                                        <button @click="quizState.submitted = false; quizAnswers = {}" class="px-6 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition-colors">Ulangi Kuis</button>
                                        <button @click="markAsCompleted(activeNode.id)" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-black text-xs transition-colors shadow-md">Tandai Selesai & Lanjut</button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                </div>
            </template>
        </main>
    </div>

    <script>
        function lmsPlayer() {
            return {
                sidebarOpen: false,
                courseData: null,
                babs: [],
                activeNode: null,
                completedNodes: [],
                quizAnswers: {},
                quizState: { submitted: false, score: 0, correct: 0, total: 0 },
                
                // YouTube Interactive API state
                ytPlayer: null,
                ytPollInterval: null,
                interactiveQuiz: {
                    active: false,
                    currentQ: null,
                    answer: null,
                    answeredQs: []
                },
                
                async init() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const courseId = urlParams.get('course');
                    
                    if (courseId) {
                        try {
                            const res = await fetch('/api/pg-lms', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ action: 'get_courses' })
                            });
                            const data = await res.json();
                            if (data.success && data.data) {
                                const course = data.data.find(c => c.id === courseId);
                                if (course) {
                                    this.courseData = course;
                                    this.babs = course.modules || course.babs || course.content || [];
                                } else {
                                    this.tryLoadDraft();
                                }
                            } else {
                                this.tryLoadDraft();
                            }
                        } catch(e) {
                            this.tryLoadDraft();
                        }
                    } else {
                        this.tryLoadDraft();
                    }
                    
                    // Fetch completed modules from server if available (mocked for now since it needs user data)
                    this.loadProgress();

                    // Load YT Iframe API
                    if (!window.YT) {
                        const tag = document.createElement('script');
                        tag.src = "https://www.youtube.com/iframe_api";
                        const firstScriptTag = document.getElementsByTagName('script')[0];
                        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
                    }
                    
                    // Auto open first node
                    if (this.babs.length > 0 && this.babs[0].subBabs && this.babs[0].subBabs.length > 0) {
                        this.openNode(this.babs[0].subBabs[0]);
                    }
                },

                tryLoadDraft() {
                    const saved = localStorage.getItem('lms_builder_draft');
                    if (saved) {
                        try {
                            this.babs = JSON.parse(saved);
                        } catch(e) { console.error('Gagal meload data', e); }
                    }
                },

                async loadProgress() {
                    try {
                        const sessionRaw = localStorage.getItem('nls_student_auth_session') || localStorage.getItem('nls_auth_session');
                        if (sessionRaw && this.courseData) {
                            const session = JSON.parse(sessionRaw);
                            if (session.id) {
                                const res = await fetch('/api/pg-lms', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ action: 'get_lms_data', userId: session.id })
                                });
                                const data = await res.json();
                                if (data.success && data.lmsData && data.lmsData.progressMap) {
                                    const courseProgress = data.lmsData.progressMap[this.courseData.id];
                                    if (courseProgress && courseProgress.completedModules) {
                                        this.completedNodes = courseProgress.completedModules;
                                    }
                                }
                            }
                        }
                    } catch(e) {
                        console.log('Failed to load progress', e);
                    }
                },

                initYoutubePlayer() {
                    if (this.ytPlayer) {
                        this.ytPlayer.destroy();
                        this.ytPlayer = null;
                    }
                    if (this.ytPollInterval) {
                        clearInterval(this.ytPollInterval);
                    }
                    
                    this.interactiveQuiz.active = false;
                    this.interactiveQuiz.answeredQs = [];
                    
                    if (!this.activeNode || this.activeNode.type !== 'video' || !this.activeNode.videoUrl) return;
                    
                    const videoId = this.extractYoutubeId(this.activeNode.videoUrl);
                    if (!videoId) return;

                    const setupPlayer = () => {
                        this.ytPlayer = new YT.Player('yt-player-container', {
                            videoId: videoId,
                            playerVars: { 'playsinline': 1 },
                            events: {
                                'onStateChange': this.onPlayerStateChange.bind(this)
                            }
                        });
                    };

                    if (window.YT && window.YT.Player) {
                        setupPlayer();
                    } else {
                        window.onYouTubeIframeAPIReady = () => {
                            setupPlayer();
                        };
                    }
                },

                onPlayerStateChange(event) {
                    if (event.data == YT.PlayerState.PLAYING) {
                        this.ytPollInterval = setInterval(() => this.checkInteractiveQuizzes(), 1000);
                    } else {
                        clearInterval(this.ytPollInterval);
                    }
                    
                    // Mark video as completed if it ends
                    if (event.data == YT.PlayerState.ENDED) {
                        this.markAsCompleted(this.activeNode.id);
                    }
                },

                checkInteractiveQuizzes() {
                    if (!this.ytPlayer || !this.activeNode || !this.activeNode.questions) return;
                    
                    const currentTime = this.ytPlayer.getCurrentTime();
                    
                    // Find a question that should trigger now
                    const qToTrigger = this.activeNode.questions.find(q => 
                        q.videoTimestamp && 
                        parseInt(q.videoTimestamp) <= currentTime && 
                        !this.interactiveQuiz.answeredQs.includes(q.id)
                    );

                    if (qToTrigger) {
                        this.ytPlayer.pauseVideo();
                        this.interactiveQuiz.currentQ = qToTrigger;
                        this.interactiveQuiz.answer = null;
                        this.interactiveQuiz.active = true;
                    }
                },
                
                skipInteractiveQuiz() {
                    this.interactiveQuiz.answeredQs.push(this.interactiveQuiz.currentQ.id);
                    this.interactiveQuiz.active = false;
                    if (this.ytPlayer) this.ytPlayer.playVideo();
                },

                submitInteractiveQuiz() {
                    if (this.interactiveQuiz.answer === null) {
                        alert('Silakan pilih jawaban terlebih dahulu!');
                        return;
                    }
                    
                    const q = this.interactiveQuiz.currentQ;
                    if (this.interactiveQuiz.answer == q.correctAnswers) {
                        // Show toast or something for correct answer
                        // alert('Benar!');
                    } else {
                        // alert('Salah, tapi Anda bisa lanjut menonton.');
                    }
                    
                    this.skipInteractiveQuiz(); // Resumes video and marks as answered
                },

                openNode(node) {
                    if (this.ytPlayer) {
                        this.ytPlayer.destroy();
                        this.ytPlayer = null;
                    }
                    if (this.ytPollInterval) clearInterval(this.ytPollInterval);
                    
                    this.activeNode = node;
                    this.sidebarOpen = false;
                    this.quizState.submitted = false;
                    this.quizAnswers = {};
                    
                    // Allow Alpine to update DOM, then init player if video
                    this.$nextTick(() => {
                        if (this.activeNode.type === 'video') {
                            this.initYoutubePlayer();
                        }
                    });
                },


                isCompleted(id) {
                    return this.completedNodes.includes(id);
                },

                markAsCompleted(id) {
                    if (!this.completedNodes.includes(id)) {
                        this.completedNodes.push(id);
                        
                        // Sync to database
                        try {
                            const sessionRaw = localStorage.getItem('nls_student_auth_session') || localStorage.getItem('nls_auth_session');
                            if (sessionRaw && this.courseData) {
                                const session = JSON.parse(sessionRaw);
                                if (session.id) {
                                    fetch('/api/pg-lms', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({
                                            action: 'update_progress',
                                            userId: session.id,
                                            courseId: this.courseData.id,
                                            progress: this.getProgress(),
                                            completedModules: this.completedNodes
                                        })
                                    }).catch(e => {});
                                }
                            }
                        } catch(e) {}
                    }
                },

                getProgress() {
                    let totalNodes = 0;
                    this.babs.forEach(b => totalNodes += (b.subBabs ? b.subBabs.length : 0));
                    if (totalNodes === 0) return 0;
                    return Math.round((this.completedNodes.length / totalNodes) * 100);
                },

                extractYoutubeId(url) {
                    if (!url) return '';
                    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                    const match = url.match(regExp);
                    return (match && match[2].length === 11) ? match[2] : null;
                },

                submitQuiz() {
                    if (!this.activeNode || !this.activeNode.questions) return;
                    
                    let correct = 0;
                    let totalGradable = 0;
                    
                    this.activeNode.questions.forEach(q => {
                        if (q.type === 'essai') return; // Skip auto-grading for essay
                        
                        totalGradable++;
                        const ans = this.quizAnswers[q.id];
                        
                        if (q.type === 'pg') {
                            if (ans == q.correctAnswers) correct++;
                        } 
                        else if (q.type === 'pg_kompleks') {
                            const correctArr = q.correctAnswersArray || [];
                            const userArr = ans || [];
                            if (correctArr.length === userArr.length && correctArr.every(val => userArr.includes(val))) {
                                correct++;
                            }
                        }
                        else if (q.type === 'pg_majemuk') {
                            let allMatch = true;
                            const userObj = ans || {};
                            q.statements.forEach((stmt, sIdx) => {
                                if (userObj[sIdx] !== stmt.isCorrect) allMatch = false;
                            });
                            if (allMatch && q.statements.length > 0) correct++;
                        }
                        else if (q.type === 'jodoh') {
                            let allMatch = true;
                            const userObj = ans || {};
                            q.pairs.forEach((pair, pIdx) => {
                                if (userObj[pIdx] !== pair.right) allMatch = false;
                            });
                            if (allMatch && q.pairs.length > 0) correct++;
                        }
                        else if (q.type === 'isian') {
                            if (!q.shortAnswerKeys) return;
                            const keys = q.shortAnswerKeys.toLowerCase().split(',').map(k => k.trim());
                            if (ans && keys.includes(ans.toString().toLowerCase().trim())) correct++;
                        }
                    });

                    this.quizState.total = totalGradable;
                    this.quizState.correct = correct;
                    this.quizState.score = totalGradable > 0 ? Math.round((correct / totalGradable) * 100) : 100;
                    this.quizState.submitted = true;
                    this.markAsCompleted(this.activeNode.id);
                } else if (q.type === 'isian') {
                            const keys = q.shortAnswerKeys.toLowerCase().split(',').map(k => k.trim());
                            if (ans && keys.includes(ans.toLowerCase().trim())) correct++;
                        }
                        // Other types logic goes here for future implementation
                    });

                    this.quizState.total = total;
                    this.quizState.correct = correct;
                    this.quizState.score = total > 0 ? Math.round((correct / total) * 100) : 0;
                    this.quizState.submitted = true;
                    this.markAsCompleted(this.activeNode.id);
                }
            }
        }
    </script>
</body>
</html>
