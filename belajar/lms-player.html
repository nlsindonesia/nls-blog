<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Player - NLS Belajar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; background-image: radial-gradient(at 0% 0%, hsla(228,100%,98%,1) 0, transparent 50%), radial-gradient(at 100% 100%, hsla(240,100%,98%,1) 0, transparent 50%); }
        .player-scroll::-webkit-scrollbar { width: 6px; }
        .player-scroll::-webkit-scrollbar-track { background: transparent; }
        .player-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .prose img { border-radius: 0.75rem; max-width: 100%; height: auto; }
        [x-cloak] { display: none !important; }
        :fullscreen, ::backdrop {
            background-color: #f8fafc;
        }
        html:fullscreen, body:fullscreen {
            width: 100vw !important;
            height: 100vh !important;
            overflow: hidden !important;
        }
        #lms-main-content:fullscreen {
            background-color: #f8fafc;
            background-image: radial-gradient(at 0% 0%, hsla(228,100%,98%,1) 0, transparent 50%), radial-gradient(at 100% 100%, hsla(240,100%,98%,1) 0, transparent 50%);
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            overflow-y: auto !important;
            padding: 1.5rem !important;
        }
        #lms-main-content:-webkit-full-screen {
            background-color: #f8fafc;
            background-image: radial-gradient(at 0% 0%, hsla(228,100%,98%,1) 0, transparent 50%), radial-gradient(at 100% 100%, hsla(240,100%,98%,1) 0, transparent 50%);
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            overflow-y: auto !important;
            padding: 1.5rem !important;
        }
        #video-card-container:fullscreen {
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            border-radius: 0 !important;
            border: none !important;
        }
        #video-card-container:-webkit-full-screen {
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            border-radius: 0 !important;
            border: none !important;
        }
    </style>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <!-- Ace Code Editor & Confetti for Competitive Programming (TLX) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/ace.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/ext-language_tools.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/theme-one_dark.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/mode-c_cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/mode-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/mode-pascal.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/mode-java.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="text-slate-800 antialiased h-screen overflow-hidden flex flex-col" x-data="lmsPlayer()" x-init="init()" @keydown.escape.window="if(isRightPaneFullscreen) toggleRightPaneFullscreen()">
    <!-- Password Prompt Overlay -->
    <div x-show="showPasswordPrompt" style="display: none;" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-md p-4">
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-8 max-w-md w-full shadow-2xl border border-slate-200 dark:border-slate-800 text-center relative overflow-hidden">
            <div class="absolute top-0 inset-x-0 h-1.5 bg-gradient-to-r from-amber-400 to-amber-600"></div>
            <div class="w-20 h-20 mx-auto bg-amber-100 dark:bg-amber-900/30 rounded-full flex items-center justify-center mb-6 border-4 border-white dark:border-slate-900 shadow-sm">
                <span class="text-4xl">🔒</span>
            </div>
            <h2 class="text-2xl font-black text-slate-800 dark:text-white mb-2" x-text="lockedCourseData ? lockedCourseData.title : 'Kelas Terkunci'"></h2>
            <p class="text-sm text-slate-500 dark:text-slate-400 mb-8">Kelas ini dilindungi dengan password. Masukkan password rahasia untuk mengakses materi pembelajaran.</p>
            
            <form @submit.prevent="submitCoursePassword" class="space-y-4">
                <div>
                    <input type="password" x-model="coursePassword" placeholder="Masukkan Password..." required
                           class="w-full px-5 py-3.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-center text-lg font-bold tracking-widest focus:ring-4 focus:ring-amber-500/20 focus:border-amber-500 outline-none transition-all placeholder:font-normal placeholder:tracking-normal">
                </div>
                <button type="submit" :disabled="isUnlocking"
                        class="w-full py-3.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-white font-black shadow-lg shadow-amber-500/30 hover:shadow-amber-500/50 transition-all flex items-center justify-center gap-2 disabled:opacity-70">
                    <span x-show="!isUnlocking">Buka Kunci Kelas</span>
                    <span x-show="isUnlocking" class="flex items-center gap-2">
                        <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        Membuka...
                    </span>
                </button>
            </form>
            <div class="mt-6 text-xs text-slate-400">
                <a href="/belajar/index.html" class="hover:text-amber-600 dark:hover:text-amber-400 transition-colors">Kembali ke Katalog</a>
            </div>
        </div>
    </div>
    <!-- Hero Header Premium (Compact) -->
    <header class="bg-white/70 backdrop-blur-3xl border-b border-slate-200/60 shrink-0 shadow-[0_4px_30px_rgba(0,0,0,0.02)] z-30 relative">
        <!-- Dekorasi Background -->
        <div class="absolute top-0 right-0 w-96 h-96 bg-indigo-400/10 rounded-full blur-[80px] -translate-y-1/2 translate-x-1/3 pointer-events-none"></div>
        
        <div class="max-w-[1600px] mx-auto relative z-10 px-4 sm:px-6 py-3 sm:py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <!-- Kiri: Logo & Back -->
            <div class="flex items-center w-full md:w-auto justify-between md:justify-start gap-4">
                <div class="flex items-center gap-3">
                    <a href="index.html" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white/60 hover:bg-white shadow-[0_2px_8px_rgba(0,0,0,0.03)] border border-indigo-50 text-indigo-900 transition-all active:scale-95 shrink-0">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
                    </a>
                    
                    <div class="flex items-center gap-3 pr-4 md:border-r border-indigo-200/50 shrink-0">
                        <img src="/nls-logo-300.png" alt="NLS Logo" class="w-8 h-8 object-contain drop-shadow-sm">
                        <div class="hidden sm:block font-black text-xs tracking-tight text-indigo-950 uppercase">Next Level Study</div>
                    </div>
                </div>
                
                <button @click="sidebarOpen = !sidebarOpen" class="md:hidden w-10 h-10 flex items-center justify-center rounded-xl bg-white/60 hover:bg-white text-indigo-900 shadow-sm border border-indigo-50">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
            </div>
            
            <!-- Tengah: (Dipindah ke Sidebar) -->
            <div class="flex-1 w-full min-w-0"></div>
            
            <!-- Kanan: Layar Penuh & Progress -->
            <div class="w-full md:w-auto flex items-center justify-between md:justify-end gap-3 shrink-0">
                <!-- Global Fullscreen Button -->
                <button type="button" @click="toggleAppFullscreen()"
                    class="px-4 py-2.5 rounded-2xl bg-white/70 hover:bg-white border border-indigo-100/90 hover:border-indigo-300 text-indigo-950 shadow-sm hover:shadow transition-all flex items-center gap-2 text-xs font-black active:scale-95 cursor-pointer shrink-0 group"
                    :title="isAppFullscreen ? 'Keluar Layar Penuh (Esc)' : 'Buka Layar Penuh (Fokus Belajar)'">
                    <svg x-show="!isAppFullscreen" class="w-4 h-4 text-indigo-600 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
                    <svg x-show="isAppFullscreen" class="w-4 h-4 text-indigo-600 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 4v4H5m0 0l5-5M9 20v-4H5m0 0l5 5m6-16v4h4m0 0l-5-5m5 16v-4h-4m0 0l5 5"/></svg>
                    <span class="inline" x-text="isAppFullscreen ? 'Keluar Layar Penuh' : 'Layar Penuh'"></span>
                </button>

                <!-- Progress Kelas Widget -->
                <div class="flex-1 md:w-60 md:flex-initial bg-white/40 backdrop-blur-xl p-2.5 rounded-2xl border border-white/60 shadow-sm flex flex-col justify-center">
                    <div class="flex items-center justify-between mb-1.5 px-1">
                        <span class="text-[9px] font-black uppercase tracking-wider text-indigo-900 flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-pulse"></span>
                            Progress Kelas
                        </span>
                        <span class="text-xs font-black text-indigo-700" x-text="getProgress() + '%'"></span>
                    </div>
                    <div class="w-full h-2 bg-indigo-100/50 rounded-full overflow-hidden border border-indigo-50/50 shadow-inner">
                        <div class="h-full bg-gradient-to-r from-sky-400 to-indigo-500 rounded-full transition-all duration-1000 ease-out relative" :style="'width: ' + getProgress() + '%'">
                            <div class="absolute inset-0 bg-white/20 w-full h-full animate-[shimmer_2s_infinite]"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative bg-slate-50">
        <!-- Mesh Background -->
        <div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(#4f46e5 2px, transparent 2px); background-size: 30px 30px;"></div>
        
        <!-- Sidebar Timeline -->
        <aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'" class="absolute md:relative z-20 w-[340px] h-full bg-white/60 backdrop-blur-3xl border-r border-slate-200/70 shadow-[20px_0_40px_-10px_rgba(0,0,0,0.03)] md:shadow-[10px_0_30px_-10px_rgba(0,0,0,0.02)] transition-transform duration-300 md:translate-x-0 flex flex-col shrink-0">
            <div class="px-5 pt-5 pb-4 border-b border-indigo-50 shrink-0 bg-white/50">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-[11px] font-black uppercase tracking-widest text-indigo-950 flex items-center gap-2">
                        <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                        Alur Belajar
                    </h2>
                    <button @click="sidebarOpen = false" class="md:hidden w-8 h-8 flex items-center justify-center rounded-xl bg-slate-100 text-slate-500 hover:text-rose-600">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
                
                <!-- Modern Course Info Card -->
                <div class="relative overflow-hidden bg-gradient-to-br from-indigo-600 via-indigo-700 to-indigo-900 rounded-2xl p-4 shadow-lg shadow-indigo-600/20 border border-indigo-500/30">
                    <div class="absolute -right-6 -top-6 w-24 h-24 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
                    <div class="absolute -left-6 -bottom-6 w-20 h-20 bg-sky-400/20 rounded-full blur-lg pointer-events-none"></div>
                    <div class="relative z-10 flex flex-col gap-1.5">
                        <span class="inline-block px-2 py-0.5 rounded-md bg-indigo-950/40 text-sky-200 text-[9px] font-black uppercase tracking-wider w-max border border-white/10 backdrop-blur-md shadow-sm">Kelas Saat Ini</span>
                        <h1 class="text-[13px] font-black text-white leading-snug line-clamp-2" x-text="courseData ? courseData.title : 'Program Belajar NLS'"></h1>
                        <p class="text-[10px] text-indigo-100/80 font-medium leading-relaxed mt-0.5" x-text="courseData ? 'Selesaikan semua misi pembelajaran untuk lulus' : ''"></p>
                    </div>
                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto player-scroll p-5 space-y-8">
                <template x-if="babs.length === 0">
                    <div class="text-center p-8 text-indigo-300 text-xs font-bold bg-indigo-50/50 rounded-3xl border border-indigo-100/50 border-dashed">Modul belum tersedia.</div>
                </template>
                
                <template x-for="(bab, bIdx) in babs" :key="bab.id">
                    <div class="relative">
                        <!-- Bab Header (Sticky) -->
                        <div class="sticky top-0 z-20 bg-white/90 backdrop-blur-md rounded-2xl border border-indigo-100/60 p-4 shadow-sm mb-4 cursor-pointer flex justify-between items-center" @click="bab.expanded = !bab.expanded">
                            <h3 class="text-xs font-black text-indigo-950 uppercase tracking-wide" x-text="bab.title"></h3>
                            <div class="w-6 h-6 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-400">
                                <svg class="w-3 h-3 transition-transform duration-300" :class="bab.expanded ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"/></svg>
                            </div>
                        </div>
                        
                        <!-- Timeline Nodes -->
                        <div x-show="bab.expanded" x-collapse>
                            <div class="relative pl-8 pb-4 ml-2">
                                <!-- Garis Waktu -->
                                <div class="absolute left-[9px] top-4 bottom-0 w-[2px] bg-gradient-to-b from-indigo-200 via-indigo-100 to-transparent rounded-full"></div>
                                
                                <template x-for="(node, nIdx) in bab.subBabs" :key="node.id">
                                    <div class="relative mb-6 group">
                                        <!-- Titik Timeline -->
                                        <div class="absolute -left-10 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full border-[3px] border-white shadow-sm flex items-center justify-center z-10 transition-colors"
                                            :class="isCompleted(node.id) ? 'bg-emerald-400' : (activeNode && activeNode.id === node.id ? 'bg-indigo-500' : 'bg-indigo-100')">
                                            <svg x-show="isCompleted(node.id)" class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7"/></svg>
                                        </div>
                                        
                                        <!-- Kartu Materi -->
                                        <button @click="openNode(node)" 
                                            :class="activeNode && activeNode.id === node.id ? 'bg-white shadow-[0_12px_40px_-10px_rgba(79,70,229,0.2)] border-indigo-400 ring-4 ring-indigo-100 scale-[1.03] z-10' : 'bg-white/40 hover:bg-white border-slate-200/60 hover:border-indigo-300 hover:shadow-[0_8px_20px_-8px_rgba(0,0,0,0.1)]'"
                                            class="w-full text-left rounded-3xl p-4 sm:p-5 border transition-all duration-300 relative overflow-hidden">
                                            
                                            <!-- Garis indikator node aktif -->
                                            <div x-show="activeNode && activeNode.id === node.id" class="absolute left-0 top-0 bottom-0 w-1 bg-indigo-500"></div>

                                            <div class="flex flex-col gap-3">
                                                <!-- Icon & Badge -->
                                                <div class="flex items-center justify-between">
                                                    <div class="w-10 h-10 rounded-2xl flex items-center justify-center shrink-0 shadow-inner"
                                                        :class="node.type === 'materi' ? 'bg-sky-100 text-sky-600' : (node.type === 'kuis' ? 'bg-amber-100 text-amber-600' : (node.type === 'pemrograman' ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'))">
                                                        <svg x-show="node.type === 'materi'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                                                        <svg x-show="node.type === 'kuis'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
                                                        <svg x-show="node.type === 'video'" class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                                        <svg x-show="node.type === 'pemrograman'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
                                                    </div>
                                                    
                                                    <span class="text-[9px] font-black uppercase tracking-wider px-2.5 py-1 rounded-lg"
                                                        :class="isCompleted(node.id) ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'">
                                                        <span x-text="isCompleted(node.id) ? 'Selesai' : 'Belum'"></span>
                                                    </span>
                                                </div>
                                                
                                                <!-- Title -->
                                                <div>
                                                    <h4 class="text-xs font-black text-indigo-950 leading-snug line-clamp-2" x-text="node.title"></h4>
                                                    <div class="flex items-center gap-1.5 mt-2 text-[10px] text-indigo-800/60 font-bold">
                                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                                        <span x-text="node.type === 'kuis' ? (node.quizDuration ? node.quizDuration + ' Menit' : '15 Menit') : (node.type === 'pemrograman' ? ((node.timeLimit || 1) + 's / ' + (node.memoryLimit || 256) + 'MB') : (node.duration || '15 Menit'))"></span>
                                                    </div>
                                                </div>
                                            </div>
                                        </button>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </aside>

        <!-- Main Content Area (Bagian Kanan LMS Player) -->
        <main id="lms-main-content" 
              :class="isRightPaneFullscreen ? 'fixed inset-0 z-[100] bg-slate-50 overflow-y-auto player-scroll flex flex-col p-4 sm:p-8' : 'flex-1 relative overflow-y-auto player-scroll flex flex-col z-0'">
            
            <!-- Floating Exit Fullscreen Button when in Right Pane Fullscreen -->
            <div x-show="isRightPaneFullscreen" style="display: none;" class="fixed top-5 right-5 z-[120] pointer-events-auto shadow-2xl">
                <button type="button" @click="toggleRightPaneFullscreen()"
                    class="px-5 py-3 rounded-2xl bg-slate-900/90 hover:bg-slate-950 text-white text-xs font-black shadow-2xl border border-white/20 backdrop-blur-xl flex items-center gap-2.5 active:scale-95 cursor-pointer hover:border-rose-400 transition-all group">
                    <svg class="w-4 h-4 text-rose-400 group-hover:rotate-90 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
                    <span>Keluar Layar Penuh <span class="text-[10px] text-slate-400 font-normal hidden sm:inline">(Esc)</span></span>
                </button>
            </div>
            
            <template x-if="!activeNode">
                <div class="flex-1 flex flex-col items-center justify-center p-8 text-center max-w-4xl mx-auto w-full">
                    
                    <template x-if="courseData && (courseData.introVideo || courseData.introVideoUrl)">
                        <div class="w-full mb-10 bg-black rounded-3xl overflow-hidden shadow-2xl aspect-video relative border-4 border-indigo-50">
                            <video x-show="courseData.introVideo && !courseData.introVideoUrl" :src="courseData.introVideo" class="w-full h-full object-contain" controls preload="metadata"></video>
                            <iframe x-show="courseData.introVideoUrl" :src="courseData.introVideoUrl" class="w-full h-full" frameborder="0" allowfullscreen></iframe>
                        </div>
                    </template>
                    <template x-if="!courseData || (!courseData.introVideo && !courseData.introVideoUrl)">
                        <div class="w-32 h-32 rounded-[2rem] bg-indigo-100/50 shadow-inner flex items-center justify-center mb-8 rotate-3">

                                                            x-text="q.type === 'pg' ? 'PG Sederhana' : q.type === 'pg_kompleks' ? 'PG Kompleks' : q.type === 'pg_majemuk' ? 'B/S Majemuk' : q.type === 'jodoh' ? 'Menjodohkan' : q.type === 'isian' ? 'Isian Singkat' : q.type === 'blank' ? 'Isi Titik' : q.type === 'osn_biologi' ? 'OSN Biologi' : q.type === 'range' ? 'Tebak Angka' : q.type === 'graph' ? 'Titik Koordinat' : q.type === 'puzzle' ? 'Jigsaw Puzzle' : 'Essay'"></span>
                                                    </div>

                                                    <button type="button" @click="toggleAppFullscreen()"
                                                        class="px-3 py-1.5 rounded-xl bg-slate-50 hover:bg-indigo-50 text-indigo-900 border border-slate-200 hover:border-indigo-300 text-xs font-bold transition-all flex items-center gap-1.5 shadow-xs active:scale-95 cursor-pointer shrink-0"
                                                        :title="isAppFullscreen ? 'Keluar Layar Penuh (Esc)' : 'Buka Layar Penuh Ujian (Fokus)'">
                                                        <svg x-show="!isAppFullscreen" class="w-3.5 h-3.5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
                                                        <svg x-show="isAppFullscreen" class="w-3.5 h-3.5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 4v4H5m0 0l5-5M9 20v-4H5m0 0l5 5m6-16v4h4m0 0l-5-5m5 16v-4h-4m0 0l5 5"/></svg>
                                                        <span x-text="isAppFullscreen ? 'Keluar Layar Penuh' : 'Layar Penuh'"></span>
                                                    </button>
                                                </div>

                                                <!-- Teks Soal -->
                                                <div class="prose prose-lg prose-slate max-w-none mb-8 text-slate-800 font-medium">
                                                    <div x-html="q.text ? q.text.replace(/{dash}/g, '_____') : ''"></div>
                                                </div>

                                                <!-- Opsi Jawaban (Render beda tipe) -->
                                                <div class="pl-2">
                                                    <!-- PG Sederhana -->
                                                    <template x-if="q.type === 'pg'">
                                                        <div class="space-y-3">
                                                            <template x-for="(oIdx, loopIdx) in (q._shuffledIndices || (q.options ? q.options.map((_, i) => i) : []))" :key="oIdx">
                                                                <label class="flex items-start gap-4 p-5 rounded-2xl border-2 hover:bg-indigo-50/30 cursor-pointer transition-all" 
                                                                    :class="quizAnswers[q.id] == oIdx ? 'bg-indigo-50/80 border-indigo-400 shadow-md shadow-indigo-100/50' : 'border-slate-100 hover:border-indigo-200'">
                                                                    <div class="w-8 h-8 rounded-full border-2 flex items-center justify-center shrink-0 font-bold mt-0.5 transition-colors"
                                                                        :class="quizAnswers[q.id] == oIdx ? 'border-indigo-500 bg-indigo-500 text-white' : 'border-slate-200 text-slate-400'">
                                                                        <span x-text="String.fromCharCode(65 + loopIdx)"></span>
                                                                    </div>
                                                                    <input type="radio" :name="'q_' + q.id" :value="oIdx" x-model.number="quizAnswers[q.id]" class="hidden">
                                                                    <div class="text-base text-slate-700 font-medium pt-1" x-text="q.options[oIdx]"></div>
                                                                </label>
                                                            </template>
                                                        </div>
                                                    </template>

                                                    <!-- PG Kompleks -->
                                                    <template x-if="q.type === 'pg_kompleks'">
                                                        <div class="space-y-3">
                                                            <div x-init="if(!Array.isArray(quizAnswers[q.id])) quizAnswers[q.id] = []"></div>
                                                            <template x-for="(oIdx, loopIdx) in (q._shuffledIndices || (q.options ? q.options.map((_, i) => i) : []))" :key="oIdx">
                                                                    <label class="flex items-start gap-4 p-5 rounded-2xl border-2 cursor-pointer transition-all" 
                                                                        :class="(Array.isArray(quizAnswers[q.id]) && quizAnswers[q.id].includes(oIdx.toString())) ? 'bg-indigo-50/80 border-indigo-400 shadow-md shadow-indigo-100/50' : 'border-slate-100 hover:border-indigo-200 hover:bg-indigo-50/30'">
                                                                        <input type="checkbox" :name="'q_' + q.id" :value="oIdx.toString()" 
                                                                            :checked="Array.isArray(quizAnswers[q.id]) && quizAnswers[q.id].includes(oIdx.toString())"
                                                                            @change="if(!Array.isArray(quizAnswers[q.id])) quizAnswers[q.id] = []; if($el.checked) { if(!quizAnswers[q.id].includes($el.value)) quizAnswers[q.id].push($el.value); } else { quizAnswers[q.id] = quizAnswers[q.id].filter(v => v !== $el.value); } debounceAutosave()" 
                                                                            class="mt-1 w-5 h-5 text-indigo-600 border-slate-300 focus:ring-indigo-600 cursor-pointer rounded">
                                                                        <span class="text-base text-slate-700 font-medium pt-0.5" x-text="q.options[oIdx]"></span>
                                                                    </label>
                                                            </template>
                                                        </div>
                                                    </template>

                                                    <!-- PG Majemuk -->
                                                    <template x-if="q.type === 'pg_majemuk'">
                                                        <div class="space-y-4">
                                                             <div x-init="if(!quizAnswers[q.id]) quizAnswers[q.id] = {}; if(!q._shuffledStmts) q._shuffledStmts = activeNode.quizShuffleOptions !== false ? shuffleArray(q.statements.map((_, i) => i)) : q.statements.map((_, i) => i)"></div>
                                                             <div class="grid grid-cols-12 gap-3 text-[11px] font-black uppercase tracking-wider text-slate-400 border-b-2 border-slate-100 pb-3">
                                                                 <div class="col-span-8">Pernyataan</div>
                                                                 <div class="col-span-2 text-center text-emerald-500">Benar</div>
                                                                 <div class="col-span-2 text-center text-rose-500">Salah</div>
                                                             </div>
                                                             <template x-for="(sIdx, loopIdx) in q._shuffledStmts" :key="sIdx">
                                                                 <div class="grid grid-cols-12 gap-3 items-center py-4 border-b border-slate-50 hover:bg-slate-50/80 rounded-xl px-2 transition-colors">
                                                                     <div class="col-span-8 text-base font-medium text-slate-700" x-text="q.statements[sIdx].text"></div>
                                                                     <div class="col-span-2 flex justify-center">
                                                                         <input type="radio" :name="'qm_' + q.id + '_' + sIdx" value="true" x-model="quizAnswers[q.id][sIdx]" @change="debounceAutosave()" class="w-5 h-5 text-emerald-500 cursor-pointer focus:ring-emerald-500 border-slate-300">
                                                                     </div>
                                                                     <div class="col-span-2 flex justify-center">
                                                                         <input type="radio" :name="'qm_' + q.id + '_' + sIdx" value="false" x-model="quizAnswers[q.id][sIdx]" @change="debounceAutosave()" class="w-5 h-5 text-rose-500 cursor-pointer focus:ring-rose-500 border-slate-300">
                                                                     </div>
                                                                 </div>
                                                             </template>
                                                        </div>
                                                    </template>

                                                    <!-- Menjodohkan -->
                                                    <template x-if="q.type === 'jodoh'">
                                                        <div class="space-y-4">
                                                            <div x-init="if(!quizAnswers[q.id]) quizAnswers[q.id] = {}; if(!q._shuffledRights) q._shuffledRights = activeNode.quizShuffleOptions !== false ? shuffleArray([...q.pairs.map(p => p.right)]) : [...q.pairs.map(p => p.right)];"></div>
                                                            <template x-for="(pair, pIdx) in q.pairs" :key="pIdx">
                                                                <div class="flex flex-col md:flex-row md:items-center gap-4 bg-slate-50/80 p-5 rounded-2xl border border-slate-100">
                                                                    <div class="flex-1 font-medium text-slate-800 text-base" x-text="pair.left"></div>
                                                                    <div class="shrink-0 text-slate-300 hidden md:block">
                                                                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                                                                    </div>
                                                                    <div class="flex-1 md:w-64">
                                                                        <select x-model="quizAnswers[q.id][pIdx]" @change="debounceAutosave()" class="w-full p-4 rounded-xl border-2 border-slate-200 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 bg-white cursor-pointer font-medium text-slate-700 appearance-none">
                                                                            <option value="" disabled selected>Pilih Pasangan...</option>
                                                                            <template x-for="(rightOpt, rIdx) in q._shuffledRights" :key="rIdx">
                                                                                <option :value="rightOpt" x-text="rightOpt"></option>
                                                                            </template>
                                                                        </select>
                                                                    </div>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </template>

                                                    <!-- Isian Singkat -->
                                                    <template x-if="q.type === 'isian'">
                                                        <div class="mt-4">
                                                            <input type="text" x-model="quizAnswers[q.id]" @input.debounce.1000ms="debounceAutosave()" placeholder="Ketik jawaban singkat Anda di sini..." class="w-full px-6 py-5 rounded-2xl border-2 border-slate-200 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 text-lg font-bold bg-slate-50 focus:bg-white transition-all">
                                                        </div>
                                                    </template>

                                                    <!-- Essay -->
                                                    <template x-if="q.type === 'essai'">
                                                        <div class="mt-4 space-y-4">
                                                            <textarea x-model="quizAnswers[q.id]" @input.debounce.1000ms="debounceAutosave()" rows="6" placeholder="Ketik jawaban essay Anda (opsional jika mengunggah file)..." class="w-full p-6 rounded-2xl border-2 border-slate-200 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 text-base bg-slate-50 focus:bg-white transition-all font-medium"></textarea>
                                                            <div class="border-2 border-dashed border-indigo-200 rounded-2xl p-8 text-center hover:bg-indigo-50/50 transition-colors cursor-pointer relative overflow-hidden group bg-indigo-50/20">
                                                                <input type="file" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" @change="quizAnswers[q.id + '_file'] = $event.target.files[0]?.name; debounceAutosave()">
                                                                <div class="w-16 h-16 mx-auto rounded-full bg-white flex items-center justify-center shadow-sm mb-4 group-hover:scale-110 transition-transform">
                                                                    <svg class="w-8 h-8 text-indigo-400 group-hover:text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                                                                </div>
                                                                <p class="text-base font-black text-indigo-900" x-text="quizAnswers[q.id + '_file'] ? 'File Terpilih: ' + quizAnswers[q.id + '_file'] : 'Klik atau Tarik dokumen ke sini'"></p>
                                                            </div>
                                                        </div>
                                                    </template>

                                                    <!-- Fill in the Blanks -->
                                                    <template x-if="q.type === 'blank'">
                                                        <div class="mt-4 space-y-4 p-6 bg-slate-50 rounded-2xl border border-slate-100" x-init="if(typeof quizAnswers[q.id] !== 'object' || Array.isArray(quizAnswers[q.id])) quizAnswers[q.id] = {}">
                                                            <div class="text-lg font-medium text-slate-700 leading-loose flex flex-wrap items-center gap-y-3 gap-x-2">
                                                                <template x-for="(part, idx) in (q.blankText || '').split('{dash}')">
                                                                    <div class="flex items-center">
                                                                        <span x-html="part"></span>
                                                                        <template x-if="idx < (q.blankText || '').split('{dash}').length - 1">
                                                                            <input type="text" x-model="quizAnswers[q.id][idx]" @input.debounce.1000ms="debounceAutosave()" class="mx-2 w-32 px-3 py-1 text-center font-bold text-indigo-700 bg-white border-b-2 border-indigo-300 focus:border-indigo-600 focus:outline-none transition-colors shadow-sm rounded-t-md" placeholder="...">
                                                                        </template>
                                                                    </div>
                                                                </template>
                                                            </div>
                                                        </div>
                                                    </template>

                                                    <!-- OSN Biologi (4 Pernyataan) -->
                                                    <template x-if="q.type === 'osn_biologi'">
                                                        <div class="mt-4 space-y-3" x-init="if(typeof quizAnswers[q.id] !== 'object' || Array.isArray(quizAnswers[q.id])) quizAnswers[q.id] = {}">
                                                            <template x-for="(stmt, idx) in q.osnStatements" :key="idx">
                                                                <div class="flex items-center justify-between p-4 bg-white border-2 border-slate-100 rounded-xl hover:border-indigo-100 transition-colors">
                                                                    <div class="flex-1 pr-6 font-medium text-slate-700" x-html="stmt.text"></div>
                                                                    <div class="flex items-center gap-4 bg-slate-50 p-1.5 rounded-lg border border-slate-200">
                                                                        <label class="flex items-center gap-2 px-3 py-1.5 rounded cursor-pointer transition-colors" :class="quizAnswers[q.id][idx] === 'true' ? 'bg-emerald-100 text-emerald-700' : 'hover:bg-slate-200'">
                                                                            <input type="radio" :name="'osn_' + q.id + '_' + idx" value="true" x-model="quizAnswers[q.id][idx]" @change="debounceAutosave()" class="hidden">
                                                                            <span class="font-bold text-sm">BENAR</span>
                                                                        </label>
                                                                        <label class="flex items-center gap-2 px-3 py-1.5 rounded cursor-pointer transition-colors" :class="quizAnswers[q.id][idx] === 'false' ? 'bg-rose-100 text-rose-700' : 'hover:bg-slate-200'">
                                                                            <input type="radio" :name="'osn_' + q.id + '_' + idx" value="false" x-model="quizAnswers[q.id][idx]" @change="debounceAutosave()" class="hidden">
                                                                            <span class="font-bold text-sm">SALAH</span>
                                                                        </label>
                                                                    </div>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </template>

                                                    <!-- Range Slider -->
                                                    <template x-if="q.type === 'range'">
                                                        <div class="mt-8 px-4" x-init="if(typeof quizAnswers[q.id] === 'undefined' || Array.isArray(quizAnswers[q.id]) || typeof quizAnswers[q.id] === 'object') quizAnswers[q.id] = (((parseFloat(q.rangeMin ?? q.minRange)||0) + (parseFloat(q.rangeMax ?? q.maxRange)||100))/2)">
                                                            <div class="relative w-full">
                                                                <input type="range" :min="q.rangeMin ?? q.minRange ?? 0" :max="q.rangeMax ?? q.maxRange ?? 100" :step="q.rangeStep ?? q.step ?? 1" x-model="quizAnswers[q.id]" @change="debounceAutosave()" class="w-full h-3 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                                                                <div class="flex justify-between mt-3 text-xs font-black text-slate-400">
                                                                    <span x-text="q.rangeMin ?? q.minRange ?? 0"></span>
                                                                    <span x-text="q.rangeMax ?? q.maxRange ?? 100"></span>
                                                                </div>
                                                                <div class="absolute -top-12 left-1/2 transform -translate-x-1/2 bg-indigo-600 text-white font-black px-4 py-1.5 rounded-full shadow-lg whitespace-nowrap">
                                                                    Jawaban: <span x-text="quizAnswers[q.id]"></span>
                                                                    <div class="absolute -bottom-1.5 left-1/2 transform -translate-x-1/2 w-3 h-3 bg-indigo-600 rotate-45"></div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </template>

                                                    <!-- Interactive Graph -->
                                                    <template x-if="q.type === 'graph'">
                                                        <div class="mt-4 flex justify-center" x-init="if(!Array.isArray(quizAnswers[q.id])) quizAnswers[q.id] = []">
                                                            <div class="relative bg-white border border-slate-300 rounded-lg shadow-inner overflow-hidden cursor-crosshair w-full max-w-[500px] aspect-square" 
                                                                 @click="(e) => { 
                                                                     const rect = $el.getBoundingClientRect(); 
                                                                     const clickX = e.clientX - rect.left; 
                                                                     const clickY = e.clientY - rect.top; 
                                                                     const gridX = Math.round((clickX / rect.width) * 20 - 10); 
                                                                     const gridY = Math.round(10 - (clickY / rect.height) * 20); 
                                                                     const existing = quizAnswers[q.id].findIndex(p => p.x === gridX && p.y === gridY);
                                                                     if(existing > -1) quizAnswers[q.id].splice(existing, 1);
                                                                     else quizAnswers[q.id].push({x: gridX, y: gridY});
                                                                     debounceAutosave();
                                                                 }">
                                                                <!-- Grid Lines -->
                                                                <svg width="100%" height="100%" viewBox="0 0 400 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                                                                    <defs>
                                                                        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                                                                            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#cbd5e1" stroke-width="1"/>
                                                                        </pattern>
                                                                    </defs>
                                                                    <rect width="400" height="400" fill="url(#grid)" />
                                                                    <!-- Axes -->
                                                                    <line x1="200" y1="0" x2="200" y2="400" stroke="#475569" stroke-width="2" />
                                                                    <line x1="0" y1="200" x2="400" y2="200" stroke="#475569" stroke-width="2" />
                                                                </svg>
                                                                <!-- Points -->
                                                                <template x-for="(pt, i) in quizAnswers[q.id]" :key="i">
                                                                    <div class="absolute w-4 h-4 bg-indigo-500 rounded-full shadow transform -translate-x-1/2 -translate-y-1/2 transition-all hover:bg-rose-500 hover:scale-125"
                                                                         :style="`left: ${(pt.x + 10) * 5}%; top: ${(10 - pt.y) * 5}%;`"
                                                                         @click.stop="quizAnswers[q.id].splice(i, 1); debounceAutosave()">
                                                                    </div>
                                                                </template>
                                                            </div>
                                                        </div>
                                                    </template>

                                                    <!-- Jigsaw Puzzle -->
                                                    <template x-if="q.type === 'puzzle'">
                                                        <div class="mt-4" x-init="
                                                            const diff = parseInt(q.puzzleDifficulty) || 4;
                                                            const total = diff * diff;
                                                            if (!Array.isArray(quizAnswers[q.id]) || quizAnswers[q.id].length !== total) {
                                                                quizAnswers[q.id] = shuffleArray(Array.from({length: total}, (_, i) => i));
                                                            }
                                                            $data.selectedPuzzleTile = null;
                                                        ">
                                                            <div class="max-w-md mx-auto">
                                                                <div class="aspect-square w-full relative grid border-4 border-slate-200 rounded-xl overflow-hidden bg-slate-100"
                                                                     :style="`grid-template-columns: repeat(${parseInt(q.puzzleDifficulty) || 4}, 1fr); grid-template-rows: repeat(${parseInt(q.puzzleDifficulty) || 4}, 1fr);`">
                                                                    <template x-for="(tileIdx, currentPos) in quizAnswers[q.id]" :key="currentPos">
                                                                        <div class="relative border border-white/30 cursor-pointer hover:opacity-80 transition-opacity"
                                                                             :class="$data.selectedPuzzleTile === currentPos ? 'ring-4 ring-inset ring-indigo-500 z-10' : ''"
                                                                             @click="
                                                                                if($data.selectedPuzzleTile === null) {
                                                                                    $data.selectedPuzzleTile = currentPos;
                                                                                } else {
                                                                                    const temp = quizAnswers[q.id][$data.selectedPuzzleTile];
                                                                                    quizAnswers[q.id][$data.selectedPuzzleTile] = quizAnswers[q.id][currentPos];
                                                                                    quizAnswers[q.id][currentPos] = temp;
                                                                                    $data.selectedPuzzleTile = null;
                                                                                    debounceAutosave();
                                                                                }
                                                                             ">
                                                                             <div class="absolute inset-0 bg-cover bg-no-repeat"
                                                                                  :style="`background-image: url('${q.puzzleImage || 'https://via.placeholder.com/400'}'); background-size: ${(parseInt(q.puzzleDifficulty)||4)*100}% ${(parseInt(q.puzzleDifficulty)||4)*100}%; background-position: ${(tileIdx % (parseInt(q.puzzleDifficulty)||4)) * (100/(((parseInt(q.puzzleDifficulty)||4)-1) || 1))}% ${Math.floor(tileIdx / (parseInt(q.puzzleDifficulty)||4)) * (100/(((parseInt(q.puzzleDifficulty)||4)-1) || 1))}%;`">
                                                                             </div>
                                                                        </div>
                                                                    </template>
                                                                </div>
                                                                <p class="text-center text-xs text-slate-500 mt-4 font-bold bg-slate-100 py-2 rounded-lg border border-slate-200 shadow-sm">Klik kotak pertama, lalu klik kotak kedua untuk menukar posisinya.</p>
                                                            </div>
                                                        </div>
                                                    </template>

                                                </div>

                                                <!-- Navigasi Bawah (Action Buttons) -->
                                                <div class="mt-12 pt-6 border-t border-indigo-50 flex flex-col sm:flex-row items-center justify-between gap-4">
                                                    <button @click="prevQuestion()" :disabled="quizState.currentQIdx === 0" class="w-full sm:w-auto px-6 py-3.5 rounded-2xl font-bold text-sm transition-all flex items-center justify-center gap-2" :class="quizState.currentQIdx === 0 ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95'">
                                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
                                                        Sebelumnya
                                                    </button>

                                                    <button @click="toggleDoubtful()" class="w-full sm:w-auto px-6 py-3.5 rounded-2xl font-bold text-sm transition-all flex items-center justify-center gap-2 border-2 active:scale-95" :class="quizState.doubtful.includes(q.id) ? 'bg-amber-100 border-amber-200 text-amber-700' : 'bg-white border-amber-200 text-amber-600 hover:bg-amber-50'">
                                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                                        <span x-text="quizState.doubtful.includes(q.id) ? 'Hapus Ragu-ragu' : 'Tandai Ragu-ragu'"></span>
                                                    </button>

                                                    <button @click="nextQuestion()" :disabled="quizState.currentQIdx === quizState.activeQuestions.length - 1" class="w-full sm:w-auto px-6 py-3.5 rounded-2xl font-bold text-sm transition-all flex items-center justify-center gap-2" :class="quizState.currentQIdx === quizState.activeQuestions.length - 1 ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg shadow-indigo-600/30 active:scale-95'">
                                                        Selanjutnya
                                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
                                                    </button>
                                                </div>

                                            </div>
                                        </template>
                                    </div>

                                    <!-- Area Kanan: Grid Navigasi CBT & Timer -->

    <script>
        function shuffleArray(array) {
            if (!Array.isArray(array)) return [];
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }
        window.shuffleArray = shuffleArray;

        function lmsPlayer() {
            return {
                shuffleArray,

                showPasswordPrompt: false,
                coursePassword: '',
                lockedCourseData: null,
                isUnlocking: false,
                sidebarOpen: false,
                courseData: null,
                babs: [],
                activeNode: null,
                completedNodes: [],
                pastScores: {},
                quizAnswers: {},
                quizState: { submitted: false, isSubmitting: false, showDiscussion: false, hasEssay: false, score: 0, correct: 0, total: 0, inProgress: false, currentQIdx: 0, doubtful: [], timeLeft: 0, timerInterval: null, elapsedSeconds: 0, autosaveInterval: null, autosaveTimeout: null, activeQuestions: [], assignedPaket: 1 },
                
                isRightPaneFullscreen: false,
                isAppFullscreen: false,
                isMateriFullscreen: false,
                isVideoFullscreen: false,

                toggleRightPaneFullscreen() {
                    const mainEl = document.getElementById('lms-main-content');
                    const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
                    
                    if (!isFs && !this.isRightPaneFullscreen) {
                        this.isRightPaneFullscreen = true;
                        if (mainEl) {
                            try {
                                const req = mainEl.requestFullscreen || mainEl.webkitRequestFullscreen || mainEl.msRequestFullscreen || mainEl.mozRequestFullScreen;
                                if (req) {
                                    req.call(mainEl).catch(() => {});
                                }
                            } catch(e) {}
                        }
                    } else {
                        this.isRightPaneFullscreen = false;
                        try {
                            if (document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement) {
                                const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen || document.mozCancelFullScreen;
                                if (exit) {
                                    exit.call(document).catch(() => {});
                                }
                            }
                        } catch(e) {}
                    }
                },

                toggleAppFullscreen() {
                    this.toggleRightPaneFullscreen();
                },

                toggleMateriFullscreen() {
                    this.toggleRightPaneFullscreen();
                },

                cloudCpSubmissions: [],
                cloudCpDrafts: {},
                cpDraftTimeout: null,

                getStudentId() {
                    try {
                        const sessionRaw = localStorage.getItem('nls_student_auth_session') || localStorage.getItem('nls_auth_session');
                        if (sessionRaw) {
                            const sess = JSON.parse(sessionRaw);
                            if (sess && sess.id) return String(sess.id);
                            if (sess && sess.email) return String(sess.email);
                            if (sess && sess.username) return String(sess.username);
                        }
                    } catch(e) {}
                    return 'guest';
                },

                lastSavedDraftMap: {},

                debounceSaveCpDraft(code, lang) {
                    if (!code || !this.activeNode || !this.courseData) return;
                    const studentId = this.getStudentId();
                    if (studentId === 'guest') return;

                    const draftKey = `${this.courseData.id}_${this.activeNode.id}_${lang}`;
                    if (this.lastSavedDraftMap[draftKey] === code) return;

                    if (this.cpDraftTimeout) clearTimeout(this.cpDraftTimeout);
                    this.cpDraftTimeout = setTimeout(() => {
                        if (this.lastSavedDraftMap[draftKey] === code) return;
                        this.lastSavedDraftMap[draftKey] = code;

                        fetch('/api/pg-lms', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                action: 'save_cp_draft',
                                userId: studentId,
                                courseId: this.courseData.id,
                                moduleId: this.activeNode.id,
                                language: lang,
                                code: code
                            })
                        }).catch(() => {});
                    }, 12000);
                },

                // YouTube Interactive API state
                ytPlayer: null,
                ytPollInterval: null,
                interactiveQuiz: {
                    active: false,
                    currentQ: null,
                    answer: null,
                    answeredQs: []
                },

                // Competitive Programming (TLX / CP) State
                cpState: {
                    selectedLang: 'cpp17',
                    activeTab: 'code', // 'code' | 'submissions'
                    activeLeftTab: 'problem', // 'problem' | 'editorial'
                    activeConsoleTab: 'custom', // 'custom' | 'samples' | 'verdict'
                    customInput: '',
                    customOutput: '',
                    customStderr: '',
                    customTimeMs: 0,
                    isRunningCustom: false,
                    isRunningSamples: false,
                    sampleResults: [],
                    isSubmitting: false,
                    lastVerdict: null, // { verdict, score, totalScore, passedCount, totalCount, testResults, maxTimeMs, maxMemoryKb, compileError }
                    submissions: [],
                    showCodeModal: false,
                    viewingSubmission: null,
                    copiedSampleIdx: null,
                    showEditorialSpoiler: false,
                    editorInstance: null,
                    editorReady: false,
                    currentCode: '',
                    cursorPos: { row: 1, col: 1 },
                    bestScore: 0,
                    bestVerdict: null,
                    // Translation State (EN -> ID)
                    isTranslated: false,
                    translating: false,
                    translatedCache: {}
                },

                formatGdrivePreview(url) {
                    if (!url) return null;
                    if (url.includes('drive.google.com/file/d/')) {
                        const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
                        if (match && match[1]) {
                            return `https://drive.google.com/file/d/${match[1]}/preview`;
                        }
                    }
                    if (url.includes('drive.google.com/drive/folders/')) {
                        const match = url.match(/\/folders\/([a-zA-Z0-9_-]+)/);
                        if (match && match[1]) {
                            let resourceKey = '';
                            if (url.includes('resourcekey=')) {
                                const rkMatch = url.match(/resourcekey=([^&]+)/);
                                if (rkMatch && rkMatch[1]) {
                                    resourceKey = `&resourcekey=${rkMatch[1]}`;
                                }
                            }
                            return `https://drive.google.com/embeddedfolderview?id=${match[1]}${resourceKey}#list`;
                        }
                    }
                    if (url.includes('drive.google.com/open?id=')) {
                        const match = url.match(/id=([a-zA-Z0-9_-]+)/);
                        if (match && match[1]) {
                            return `https://drive.google.com/file/d/${match[1]}/preview`;
                        }
                    }
                    return null;
                },
